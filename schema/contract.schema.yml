# JSON Schema (draft 2020-12) for contract.yml -- the bootstrap <-> runtime
# contract version manifest (roadmap 45).
$schema: "https://json-schema.org/draft/2020-12/schema"
title: tebako-runtime-ruby bootstrap <-> runtime contract
type: object
required: [contract_version]
additionalProperties: false
properties:
  contract_version:
    type: integer
    minimum: 1
  container_version:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
    description: the toolchain container line the builds run inside (an axis independent of the artifact version)
  link_unit_release:
    type: string
    pattern: '^$|^v\d+\.\d+\.\d+$'
    description: the tamatebako/tebako release whose published link unit the legs consume (empty = build the closure from source)
  registry_reader_release:
    type: string
    pattern: '^v\d+\.\d+\.\d+$'
    description: the tamatebako/tebako release whose CLI validates the rendered registry (the publish flow's product-reader gate — a READER pin, separate from the legs' link unit)
  release_tooling:
    type: string
    pattern: '^v\d+\.\d+\.\d+$'
    description: the tamatebako/tebako-release tag the Gemfile pins (the release machinery's single owner; consumed by the publish/sign legs and the coordinator's audit)
