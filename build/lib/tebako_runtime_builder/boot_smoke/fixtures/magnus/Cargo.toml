# Boot-smoke fixture crate (issue #192) — see src/lib.rs and
# build/lib/tebako_runtime_builder/boot_smoke/magnus_fixture.rb.
[package]
name = "magnus_fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

