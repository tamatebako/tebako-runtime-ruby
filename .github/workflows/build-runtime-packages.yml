name: build-runtime-packages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.adoc'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.adoc'
      - '**.md'
  repository_dispatch:
    types: [ 'tebako release' ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and overwrite existing runtime packages'
        type: boolean
        default: false
      env_filter:
        description: 'Platform slice: "all" or "<os>/<arch>" (e.g. "linux-musl/arm64")'
        type: string
        default: 'all'
      ruby_filter:
        description: 'Rubies: "full", "tidy", or comma-separated versions (e.g. "3.3.7,3.4.2")'
        type: string
        default: 'full'
      publish:
        description: 'Run the release job (add this run''s packages to the release)'
        type: boolean
        default: true
      artifact_run_ids:
        description: 'Extra run IDs (comma-separated) whose runtime-packages-* artifacts join the release'
        type: string
        default: ''

concurrency:
  # Slice dispatches (env/ruby filters) get their own group so a debugging
  # slice never cancels the full build (or another slice) on the same ref
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == ''workflow_dispatch'' && format(''-{0}-{1}'', inputs.env_filter, inputs.ruby_filter) || '''' }}'
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  CACHE_VER: 2
  VERBOSE: no
  RUNTIME_REPO: tamatebako/tebako-runtime-ruby

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      tebako-version: ${{ steps.get-version.outputs.version }}
      source-pin: ${{ steps.get-source-pin.outputs.pin }}
      env-matrix: ${{ steps.set-matrix.outputs.env-matrix }}
      ruby-matrix: ${{ steps.set-matrix.outputs.ruby-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Get Tebako version
        id: get-version
        run: |
          version=$(cat VERSION)
          echo "Building runtimes for Tebako version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tamatebako/ruby source release pin the runtimes build from. It
      # keys the build job's .build cache: a prefix restored under the same
      # key was built from the pinned source, so a pin move must change the
      # key (see the Cache step below for what a stale restore does).
      - name: Get tamatebako/ruby source pin
        id: get-source-pin
        run: |
          pin=$(grep -oE 'DEFAULT_RELEASE = "[^"]+"' build/lib/tebako_runtime_builder/source_fetcher.rb | cut -d'"' -f2)
          echo "Building runtimes from tamatebako/ruby source release $pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      # Roadmap 45: fail before the matrix builds anything if contract.yml
      # (the release pipeline's source of truth) and the compiled-in
      # TEBAKO_CONTRACT_VERSION in the runtime driver disagree -- a contract
      # bump edits both in the same commit. Contract 2's driver is
      # crates/tebako-driver in the tebako product repo (the v1
      # tebako-main.cpp is retired); the check reads it via
      # TEBAKO_DRIVER_SRC. Pin to a release tag once the driver ships in
      # one -- main carries contract 2 today.
      - name: Checkout the tebako product repo (the v2 driver source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako-product
          ref: main

      - name: Check contract version agreement
        env:
          TEBAKO_DRIVER_SRC: tebako-product/crates/tebako-driver/src/lib.rs
        run: |
          ./scripts/check_contract_version.rb

      - name: Generate build matrix
        id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MATRIX_ENV_FILTER: ${{ inputs.env_filter || '' }}
          MATRIX_RUBY_FILTER: ${{ inputs.ruby_filter || '' }}
        run: |
          ./scripts/generate_matrix.rb

  build:
    name: Build runtime package for ${{ matrix.env.os }} / ${{ matrix.env.arch }} / Ruby ${{ matrix.ruby }}
    needs: prepare
    runs-on: ${{ matrix.env.host }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{fromJson(needs.prepare.outputs.env-matrix)}}
        ruby: ${{fromJson(needs.prepare.outputs.ruby-matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Create folder for runtime packages
        run: |
          mkdir -p runtime-packages

      # Per-(platform, ruby) cache of the whole build prefix (.build), which
      # holds both the ruby-independent deps and the ruby-specific build
      # trees. The key carries the tamatebako/ruby source release pin: a
      # prefix built from the PREVIOUS pin is stale by definition, so the
      # ExternalProject download step re-runs and re-extracts the new source
      # over the restored ruby tree -- a remove+rename that does not survive
      # Windows file locking ('file RENAME failed ... Access is denied'),
      # and a full rebuild the cache buys nothing for anyway. Caches are
      # immutable per key, so a stale entry could never repair itself; keyed
      # on the pin, a pin move is a clean cache miss instead. Host-native
      # jobs only: container jobs build inside the CI container image whose
      # toolchain is baked into the image itself, so there is no host-side
      # path to cache (the container image is the cache).
      # save-always: a boot-smoke failure must NEVER poison the cache — the
      # default (save on success only) meant every red leg left the next one
      # cold (~60 min of rebuild per iteration, the msys campaign's tax).
      - name: Cache build prefix
        if: matrix.env.container == null
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: tebako-runtime-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ matrix.ruby }}-${{ needs.prepare.outputs.tebako-version }}-${{ needs.prepare.outputs.source-pin }}-v${{ env.CACHE_VER }}
          save-always: true

      - name: Build runtime using ci container
        if: matrix.env.container != null
        run: |
          # The container images are published per (version × arch) by
          # tebako-ci-containers' build-containers.yml: :<ver>-amd64 /
          # :<ver>-arm64. The plain :<ver> tag is NOT published (an
          # arch-ambiguous reference raced the two arch legs).
          case "${{ matrix.env.arch }}" in
            x86_64) arch_suffix=amd64 ;;
            arm64)  arch_suffix=arm64 ;;
            *) echo "::error::no container arch suffix for '${{ matrix.env.arch }}'"; exit 1 ;;
          esac
          container="ghcr.io/tamatebako/tebako-${{ matrix.env.container }}:${{ needs.prepare.outputs.tebako-version }}-${arch_suffix}"
          echo "Building runtime for Ruby ${{ matrix.ruby }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.prepare.outputs.tebako-version }}-${{ matrix.ruby }}-${{ matrix.env.os }}-${{ matrix.env.arch }}"
          docker run -v ${{github.workspace}}:/mnt/w -t $container \
            /mnt/w/tools/build_runtime --ruby "${{ matrix.ruby }}" --output "/mnt/w/runtime-packages/$runtime" \
            --prefix /root/.build ${{ matrix.env.os == 'linux-gnu' && '--patchelf' || '' }}

      - name: Select XCode
        if: matrix.env.os == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.env.xcode }}

      - name: Setup MSys
        if: matrix.env.os == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: true

      - name: Install pacman packages
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          pacman -Syu --needed --noconfirm git tar bison flex pactoys
          pacboy sync --needed --noconfirm cmake:p diffutils:p          \
            dlfcn:p ninja:p                                             \
            gtest:p autotools:p ncurses:p ruby:p toolchain:p openssl:p  \
            make:p libyaml:p libxslt:p

      # The v2 link unit (scoped staticlibs + the mingw closure), built
      # in-leg from the tebako product checkout until the first published
      # windows link unit ships; then this becomes a download (the other
      # platforms' shape).
      - name: Checkout the tebako product repo (the link unit source)
        if: matrix.env.os == 'windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako-rs
          ref: main
      - name: Checkout dwarfs-rs (link-unit sibling path dep)
        if: matrix.env.os == 'windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        if: matrix.env.os == 'windows'
        with:
          targets: x86_64-pc-windows-gnu
      - name: Set up vcpkg for the link unit
        if: matrix.env.os == 'windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root
      - name: Cache vcpkg package archives (link unit)
        if: matrix.env.os == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the cargo target dir (link unit)
        if: matrix.env.os == 'windows'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            tebako-rs

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        if: matrix.env.os == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"
      - name: Build + stage the windows-gnu link unit
        if: matrix.env.os == 'windows'
        # Git-bash, and NO msys2 bin dir on PATH: vcpkg's downloaded
        # msys2 (make/perl) ABI-clashes with the setup-msys2 install when
        # both are on PATH (openssl's make install died in a perl eval
        # crash — three legs lost). The msys2 ruby is invoked by
        # ABSOLUTE path only; the C++ runtimes static-link (several mingw
        # installs on the runner make DLL resolution nondeterministic).
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
          # Trailing -lmsvcrt: rustc's -nodefaultlibs late-lib order ends
          # -lmsvcrt -lmingwex -luser32 -lkernel32, so libmingwex's compat
          # _assert.o (pulled at the LAST -lmingwex) never sees the
          # __imp___msvcrt_assert provider behind it (probe-proven:
          # libmsvcrt.a carries it; gcc's own tail keeps msvcrt after
          # mingwex, rustc's does not). The end-of-line -lmsvcrt restores
          # the invariant.
          RUSTFLAGS: -C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt
        # Everything lives in ci/link-unit.sh (reviewed, shellcheck-able) —
        # never inline run-blocks; they get string-edited and break silently.
        run: bash ci/link-unit.sh

      - name: Dump vcpkg build logs on failure
        if: failure() && matrix.env.os == 'windows'
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/*-out.log .vcpkg-root/buildtrees/*/*-err.log; do
            [ -s "$f" ] || continue
            echo "=== $f ==="
            tail -30 "$f"
          done

      - name: Setup Ruby
        if: matrix.env.container == null && matrix.env.os != 'windows'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: false

      # The Brewfile is the pin: --no-upgrade stops brew from upgrading
      # already-installed formulas mid-matrix (two legs of the same build
      # resolving different versions when brew moves under us). A formula
      # bump is an edit to ./Brewfile in a PR, never a surprise.
      - name: Install brew packages
        if: matrix.env.os == 'macos'
        run: |
          brew bundle --no-upgrade -f
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      - name: Build runtime
        if: matrix.env.container == null && matrix.env.os != 'windows'
        run: |
          echo "Building runtime for Ruby ${{ matrix.ruby }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.prepare.outputs.tebako-version }}-${{ matrix.ruby }}-${{ matrix.env.os }}-${{ matrix.env.arch }}"
          tools/build_runtime --ruby "${{ matrix.ruby }}" --output "runtime-packages/$runtime" --prefix .build

      - name: Build runtime on Windows
        if: matrix.env.container == null && matrix.env.os == 'windows'
        shell: msys2 {0}
        env:
          TEBAKO_RUST_LIBDIR: ${{ github.workspace }}/.build/link-unit
        run: |
          git config --global core.longpaths true
          echo "Building runtime for Ruby ${{ matrix.ruby }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.prepare.outputs.tebako-version }}-${{ matrix.ruby }}-${{ matrix.env.os }}-${{ matrix.env.arch }}"
          tools/build_runtime --ruby "${{ matrix.ruby }}" --output "runtime-packages/$runtime" --prefix .build

      # Diagnostics for tamatebako/tebako#345: on failure, surface the
      # ext/openssl mkmf log (which lib/header did extconf pick, and why did
      # the X509 accessor probes fail) and the generated ruby.exe link rule
      # (does it carry the --start-group wrapper) — cheap, only fires red
      - name: Dump diagnostics on failure (Windows)
        if: failure() && matrix.env.container == null && matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          find .build/deps/src -path "*/ext/openssl/mkmf.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
          find .build/deps/src -maxdepth 2 -name Makefile -exec sh -c '
            echo "== $1: start-group refs:"; grep -n "start-group" "$1" || echo "(none)"
            echo "== $1: ruby.exe link rule region:"; grep -n -B4 -A6 "EXTOBJS.*-o \$@)" "$1" || true
            echo "== $1: LIBS/MAINLIBS definitions:"; grep -n "^LIBS\|^MAINLIBS\|^EXTLIBS" "$1" || true
          ' _ {} \; || true
          # the ExternalProject-swallowed inner build log (the make error's
          # real stderr never reaches the CI output otherwise)
          find .build/deps/src -name "*-build-*.log" -o -name "*-err.log" | while read -r f; do
            echo "=== $f (tail) ==="; tail -60 "$f" || true
          done

      # The build emits TWO artifacts per leg since item 30: the runtime
      # executable and its filesystem image (<runtime>.tfs, the layout
      # tree in DwarFS form, writer defaults). Fail the leg loudly when
      # either is missing rather than discovering it at release assembly.
      - name: Verify runtime packages
        shell: bash
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.prepare.outputs.tebako-version }}-${{ matrix.ruby }}-${{ matrix.env.os }}-${{ matrix.env.arch }}"
          exe="runtime-packages/$runtime"
          # The windows artifact name (.exe suffix or not) is still settling
          # (no windows assets shipped yet) -- accept either spelling.
          [ -s "$exe" ] || exe="$exe.exe"
          test -s "$exe" || { echo "::error::missing runtime executable runtime-packages/$runtime[.exe]"; exit 1; }
          img="runtime-packages/$runtime.tfs"
          test -s "$img" || { echo "::error::missing runtime filesystem image $img"; exit 1; }
          ls -l "$exe" "$img"

      # Spec 18 S51 (C4): the nm provenance assert — the exe's tebako_main
      # must resolve from the fs TU (the CMake-built libtebako-fs.a),
      # never from the toolchain stub (its tebako_main returns 0 without
      # mounting: a shadowed link boots as a plain interpreter). Asserted
      # on the BUILD-TREE ruby.exe: strip -S on PE removes the COFF
      # symbol table (the shipped exe is the same link, stripped).
      # Everything lives in the committed script — never inline run-blocks.
      - name: Check tebako_main symbol provenance (S51)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          bash ci/check_symbol_provenance.sh \
            --exe ".build/deps/src/_ruby_${{ matrix.ruby }}/ruby.exe" \
            --stub-archive .build/deps/lib/libtebako-fs.a \
            --real-archive .build/o/libtebako-fs.a

      # Spec 18 S51 (C4), POSIX legs: the same assert on the shipped exe
      # (strip -S keeps the symbol table on ELF and Mach-O). Host builds
      # (macos) also assert the archive side — the stub archive must be
      # gone and the real archive's member provenance must be the fs TU;
      # container legs built inside the image, so only the exe side is
      # host-visible there.
      - name: Check tebako_main symbol provenance (S51)
        if: matrix.env.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.prepare.outputs.tebako-version }}-${{ matrix.ruby }}-${{ matrix.env.os }}-${{ matrix.env.arch }}"
          args=(--exe "runtime-packages/$runtime")
          if [ "${{ matrix.env.container == null }}" = "true" ]; then
            args+=(--stub-archive .build/deps/lib/libtebako-fs.a --real-archive .build/o/libtebako-fs.a)
          fi
          bash ci/check_symbol_provenance.sh "${args[@]}"

      # Roadmap item 19: boot-smoke the freshly built runtime BEFORE the
      # artifacts leave the leg. spec/boot_smoke_spec.rb (tag :boot_smoke)
      # boots the executable and exercises the memfs syscall surface
      # (stat/btime, image IO, gem home/bundler, flock) so the
      # statx/fcntl/flock drift class is caught at build time rather than
      # by tebako-rs users. The boot mirrors the image-era bootstrap:
      # TEBAKO_RUNTIME_IMAGE points at the leg's own .tfs (item 30b). A red
      # boot-smoke skips the upload below, and
      # the release job's completeness gate then fails the run loudly --
      # a drifted runtime never ships. Container legs run the class on the
      # host: the gnu/musl executables run on the ubuntu host kernel
      # directly. The bundler env stays inside these steps so the runtime
      # build above never sees a bundle exec RUBYOPT.
      - name: Setup Ruby for boot-smoke (container legs)
        if: matrix.env.container != null && matrix.env.os != 'linux-musl'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Boot-smoke the fresh runtime
        if: matrix.env.os != 'windows' && matrix.env.os != 'linux-musl'
        shell: bash
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec rspec --tag boot_smoke --format documentation

      # The musl runtime is dynamic-musl BY DESIGN (PT_INTERP
      # /lib/ld-musl-<arch>.so.1; the released v0.15.9 binaries are the
      # same shape) — and it links against the musl of the alpine CI
      # container it was built in. Execing it on the ubuntu host fails
      # twice over: no loader at all (ENOENT naming the binary), and even
      # with ubuntu's `musl` package installed, "Error relocating:
      # qsort_r/crypt_r: symbol not found" — ubuntu 22.04's musl 1.2.2
      # predates symbols the alpine-built binary needs. The truthful
      # environment is a real musl userland of the same generation, so
      # the musl legs smoke inside an alpine container. (The musl symbol
      # floor for DISTRIBUTION — musl >= 1.2.3 / alpine >= 3.17 — is a
      # separate, documented decision; TODO.v2-1/11.)
      - name: Boot-smoke the fresh runtime (musl legs, in alpine)
        if: matrix.env.os == 'linux-musl'
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          docker run --rm -v ${{ github.workspace }}:/mnt/w -w /mnt/w \
            -e TEBAKO_RUNTIME_ROOT \
            alpine:3.21 sh -c '
              set -e
              apk add --no-cache ruby ruby-dev build-base ruby-bundler >/dev/null
              bundle install --jobs 4 --retry 3
              bundle exec rspec --tag boot_smoke --format documentation'

      - name: Boot-smoke the fresh runtime (Windows)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
          bundle exec rspec --tag boot_smoke --format documentation

      - name: Upload runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ matrix.ruby }}
          path: runtime-packages
          retention-days: 1

  release:
    name: Update release packages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Never touch the production release from a pull request; otherwise run
    # whenever the run was not cancelled, even if some build matrix legs
    # failed (upload whatever artifacts exist; scripts/upload_release.rb
    # then verifies the release against the full expected matrix and FAILS
    # the run when any package, filesystem image, or metadata file is
    # missing -- a gap never ships as a silently incomplete release).
    # Slice dispatches may opt out of publishing (publish=false) for pure
    # debugging runs.
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download all runtime packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: runtime-packages
          merge-multiple: true

      # Fold in artifacts produced by earlier runs (e.g. a cancelled full
      # build) so a slice run can complete a release without rebuilding
      # platforms it does not touch. Current-run packages win on name
      # collisions (cp -n).
      - name: Download runtime packages from additional runs
        if: inputs.artifact_run_ids != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_IDS: ${{ inputs.artifact_run_ids }}
        run: |
          set -euo pipefail
          for rid in ${RUN_IDS//,/ }; do
            echo "Fetching runtime-packages-* artifacts from run $rid"
            gh run download "$rid" --repo tamatebako/tebako-runtime-ruby \
              -p 'runtime-packages-*' -D "runtime-packages-runs/$rid"
          done
          find runtime-packages-runs -type f -exec cp -n {} runtime-packages/ \;

      - name: Setup Ruby gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Update release using Ruby script
        env:
          TEBAKO_VERSION: ${{ needs.prepare.outputs.tebako-version }}
          EXPECTED_ENV_MATRIX: ${{ needs.prepare.outputs.env-matrix }}
          EXPECTED_RUBY_MATRIX: ${{ needs.prepare.outputs.ruby-matrix }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' }}
        run: |
          ./scripts/upload_release.rb
