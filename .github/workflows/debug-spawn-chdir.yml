name: debug-spawn-chdir

# tebako-runtime-ruby#344's diagnostic, v2: the v0.17.x windows runtimes
# fail tebako-packages/metanorma's html-xml check with a silent exit 1.
# The v1 rig probed the spawn of RbConfig.ruby — invalid: the env image
# carries NO bin/ruby(.exe) on ANY platform (verified locally on the
# v0.17.10 macOS pair), so those probes measured an honest ENOENT, not
# the defect. The real failing shape is a spawn of an exe that EXISTS in
# a mounted payload image, with chdir into the mount (sass-embedded's
# Open3.popen3 into its gem dir).
#
# This rig mounts a fixture holding a REAL native exe (the published
# tfs.exe as fixture/tool.exe) and runs two probes, POSIX-proven green
# on the same rig's macOS local run:
#   A) plain spawn of the in-image exe     — the exec-target
#      materialization path alone
#   B) spawn with chdir into the mount     — the chdir arm stacked on it
# The entry is mount-relative (/run.rb — the driver resolves entry
# against the mount as <mount>/<entry>). Dispatch-only; the log is the
# evidence.

on:
  workflow_dispatch:
    inputs:
      line:
        description: 'the runtime release line under test'
        type: string
        default: '0.17.10'
      ruby_version:
        description: 'the ruby series inside the pair'
        type: string
        default: '3.3.13'
      tebako_tools:
        description: 'the tebako CLI release providing tfs.exe'
        type: string
        default: 'v2.8.78'

permissions:
  contents: read

jobs:
  repro:
    name: spawn-chdir repro (windows-ucrt64)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LINE: ${{ inputs.line }}
      RB: ${{ inputs.ruby_version }}
      TOOLS: ${{ inputs.tebako_tools }}
    steps:
      - name: Set up MSYS2
        # the windows-2025-vs2026 image carries no runner-visible msys2 —
        # shell: msys2 dies "msys2: command not found" without this (the
        # metanorma feedstock's windows legs set it up for the same reason).
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            curl
            tar

      - name: Fetch the published pair + the tfs CLI (sha256-verified)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          base="https://github.com/tamatebako/tebako-runtime-ruby/releases/download/v${LINE}"
          stem="tebako-runtime-${LINE}-ruby-${RB}-windows-ucrt64"
          # the ruby factory ships per-asset sidecars
          for f in "$stem" "$stem.tfs" "$stem.dll"; do
            curl -sfLO "$base/$f"
            curl -sfLO "$base/$f.sha256"
            sha256sum -c "$f.sha256"
          done
          mv "$stem" "$stem.exe"
          # the PE import resolves the ruby DLL only as <cpu>-ucrt-ruby<ABI>.dll
          # beside the exe (the store-entry rule; abi 330 for 3.3.x)
          abi="${RB%%.*}$(echo "$RB" | cut -d. -f2)0"
          cp "$stem.dll" "x64-ucrt-ruby${abi}.dll"
          # tfs.exe from the tebako product release (the press tool)
          tbase="https://github.com/tamatebako/tebako/releases/download/${TOOLS}"
          curl -sfLO "$tbase/tfs-${TOOLS#v}-windows-ucrt64.exe"
          curl -sfLO "$tbase/tfs-${TOOLS#v}-windows-ucrt64.exe.sha256"
          sha256sum -c "tfs-${TOOLS#v}-windows-ucrt64.exe.sha256"
          ls -la
          file "$stem.exe" 2>/dev/null || true

      - name: Build the probe fixture image
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # the spawn target must EXIST in the image: the published tfs.exe
          # is a real native exe — carry it as the fixture's tool. Layout at
          # the image ROOT: the in-image path is /run.rb, /tool.exe —
          # mounted at /probe, the entry is the mount-relative /run.rb (the
          # driver resolves entry against the mount as <mount>/<entry>).
          mkdir -p fixture
          cp "tfs-${TOOLS#v}-windows-ucrt64.exe" fixture/tool.exe
          echo "marker-ok" > fixture/marker.txt
          mkdir -p fixture/sub && echo "inner-ok" > fixture/sub/inner.txt
          cat > fixture/run.rb <<'RUBY'
          require "open3"
          # the windows exe's stdout does not reach the msys2 pipe reliably
          # (two rig runs captured zero bytes off a clean exit 0) — the
          # evidence channel is a HOST file (the jail is open by default;
          # cwd is the host workspace), uploaded as the artifact.
          out = File.open("probe-results.txt", "w")
          at_exit { out.close }
          say = ->(s) { out.puts(s); out.flush; puts s }
          say.call "probe: host=#{RUBY_PLATFORM} ruby=#{RUBY_DESCRIPTION}"
          dir = File.expand_path(__dir__)
          say.call "probe: __dir__ = #{dir.inspect}"
          exe = File.join(dir, "tool.exe")
          say.call "probe: marker visible: #{File.exist?(File.join(dir, "marker.txt"))}"
          say.call "probe: tool exists: #{File.exist?(exe)} (#{exe})"

          def probe(out, tag)
            o, e, st = yield
            out.puts "#{tag}: status=#{st.exitstatus.inspect} out=#{o.inspect[0,60]} err=#{e.inspect[0,140]}"
          rescue => ex
            out.puts "#{tag}: RAISED #{ex.class}: #{ex.message}"
          end

          probe(out, "A plain-spawn") { Open3.capture3(exe) }
          probe(out, "B chdir-spawn-root") { Open3.capture3(exe, chdir: dir) }

          # C) chdir into a SUBDIRECTORY of the mount — the real-world
          #    shape (a gem's bin/ dir is never the mount root). If B
          #    fails and C passes, the defect is the mount-root edge
          #    (the relative-path-is-empty case in the materialization).
          sub = File.join(dir, "sub")
          probe(out, "C chdir-spawn-subdir") { Open3.capture3(exe, chdir: sub) }
          say.call "probe: complete"
          RUBY
          ./tfs-*.exe mkimage --format limnifs fixture --output probe.tfs
          ls -la probe.tfs

      - name: Run the spawn probes against the published runtime
        shell: msys2 {0}
        run: |
          set -uo pipefail
          export MSYS2_ARG_CONV_EXCL='*' MSYS2_ENV_CONV_EXCL='*'
          stem="tebako-runtime-${LINE}-ruby-${RB}-windows-ucrt64"
          export TEBAKO_RUNTIME_IMAGE="$(cygpath -m "$PWD/$stem.tfs")"
          # tee to a file AND upload it: a previous rig run's exe stdout
          # vanished under the msys2 wrapper (clean exit 0, nothing
          # captured) — the artifact is the capture-proof channel.
          "./$stem.exe" --tebako-image "$(cygpath -m "$PWD/probe.tfs"):-:/probe" --tebako-entry /run.rb 2>&1 | tee probe-output.txt
          echo "probe-run exit: ${PIPESTATUS[0]}"
          ls -la probe-results.txt 2>/dev/null || echo "no probe-results.txt — the script never ran"

      - name: Upload the probe output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spawn-chdir-probe-output
          retention-days: 30
          path: |
            probe-output.txt
            probe-results.txt
          if-no-files-found: warn

