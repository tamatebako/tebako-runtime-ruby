name: probe-bare-launch
# Dispatch-only: the bare-machine launch gate for a freshly built windows
# runtime. The leg runner's boot smoke is environment-masked (msys2's
# ucrt64 DLLs sit on PATH there, so dynamic-import defects pass green —
# the 0.16.3 libdl/libffi-8/libyaml-0-2 incident). This probe downloads a
# build run's runtime package and launches the exe with a PATH scrubbed
# of every msys2/git/toolchain dir — the shape of a user's machine.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The build-windows.yml run id whose runtime-packages artifact gates'
        required: true
        type: string

permissions:
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Download the run's runtime package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id }}
          pattern: runtime-packages-*
          path: pkg
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          find pkg -type f | sort
          mkdir -p rt
          find pkg -type f -exec cp {} rt/ \;
          ls -la rt/
          # the facet under its import name (the stub imports x64-ucrt-ruby<ABI>.dll)
          dll=$(find rt -name "*.dll" | head -1)
          abi=$(basename "$dll" | sed -E 's/.*-([0-9]+)\.([0-9]+)\.([0-9]+)-windows.*/\1\2/')
          mv "$dll" "rt/x64-ucrt-ruby${abi}0.dll"
          mv rt/tebako-runtime-*-windows-ucrt64 rt/rt.exe
          ls -la rt/

      - name: Launch with a scrubbed PATH (the bare-machine shape)
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          cd rt
          rt.exe --help
          echo LAUNCH-OK exit=%ERRORLEVEL%
