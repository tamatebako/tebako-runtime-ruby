# reproduce — the public verification of the reproducible-build contract
# (docs/build-chain.md's E1/E2 pins; docs/reproducible.md owns the claim's
# scope and the per-leg status table). For ONE published release leg this
# workflow:
#
#   1. era     — checks out the TAG's tree (cheap, no build spend) and
#                decides the tag's era: a pre-arc tree carries no
#                ci/record-toolchain.sh, so the current workflow cannot
#                rebuild it, and its image stamped wall-clock time — its
#                bytes can never reproduce. The leg's host_id and the
#                tag's commit SHA flow from here.
#   2. rebuild — era=post only: dispatches the platform's thin trigger
#                (build-<platform>.yml) ON THE TAG REF and watches the run
#                to completion. The tag's OWN pipeline definition runs:
#                its checkouts are the event ref (never an input — an
#                input-selected ref inside the reusable workflow's
#                cache-writing jobs is the CodeQL
#                actions/cache-poisoning/direct-cache class this file must
#                never reintroduce), and its cache writes land in the
#                TAG's own cache scope, never the default branch's.
#                publish defaults to false and this workflow holds no
#                write grant — the run can never touch the release.
#   3. verdict — ci/reproduce-verdict.sh: the published-integrity floor
#                (the leg's exe/image sha256-verified against their
#                published sidecars — every era), then era=post the
#                rebuilt-vs-published identity diff (the exe claim
#                compares PRE-SIGNING digests from both sides' provenance
#                records, so a signing leg proves the same bytes an
#                unsigned one does). A hard mismatch fails the run naming
#                the artifact + both hashes and quoting the shard's
#                built_from.toolchain. The verdict renders as the step
#                summary + a JSON artifact.
#
# The weekly schedule is a drift WATCH: it self-dispatches a
# workflow_dispatch run for the latest release's proven witness leg
# (the era/verdict jobs honor inputs only under workflow_dispatch — the
# dispatch indirection keeps every verification filter-honored).

name: reproduce

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.17.15 — shard tags like v0.16.28-ruby4.0 work too)'
        required: true
        type: string
      ruby_version:
        description: 'The leg ruby version (e.g. 4.0.9 — must name a published leg of the tag)'
        required: true
        type: string
      platform:
        description: 'The leg platform'
        type: choice
        options:
          - linux-gnu
          - linux-musl
          - macos
          - windows
        default: linux-gnu
      arch:
        description: 'The leg arch'
        type: choice
        options:
          - x86_64
          - arm64
        default: x86_64
  schedule:
    # Weekly, Monday 03:17 UTC — the drift watch. Fires only from the
    # default branch (GitHub schedule semantics): the watch activates with
    # the merge, never from a PR.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  era:
    name: Resolve the tag's era and the leg's host_id
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      era: ${{ steps.probe.outputs.era }}
      host_id: ${{ steps.probe.outputs.host_id }}
      source_sha: ${{ steps.probe.outputs.source_sha }}
    steps:
      - name: Checkout the tag's tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # The host_id grammar's owner is the factory's Platform module —
      # running the TAG's own copy keeps the flow era-correct by
      # construction (never a re-derived mapping here).
      - name: Setup Ruby (the platform vocabulary is Ruby)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Probe the era and flow the leg identity
        id: probe
        run: |
          set -euo pipefail
          # The era discriminator: the reproducible-build arc added
          # ci/record-toolchain.sh — a tag whose tree lacks it cannot be
          # rebuilt by the current pipeline (the build steps invoke it).
          if [ -f ci/record-toolchain.sh ]; then era=post; else era=pre; fi
          echo "era=$era" >> "$GITHUB_OUTPUT"
          host_id=$(ruby -Ibuild/lib -e 'require "tebako_runtime_builder/platform"; print TebakoRuntimeBuilder::Platform.host_id_for(ARGV[0], ARGV[1])' \
            "${{ inputs.platform }}" "${{ inputs.arch }}")
          echo "host_id=$host_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag ${{ inputs.tag }}: era=$era host_id=$host_id"

  rebuild:
    name: Dispatch + watch the tag's own build
    needs: era
    if: github.event_name == 'workflow_dispatch' && needs.era.outputs.era == 'post'
    runs-on: ubuntu-24.04
    # The watched build runs the full leg: a cold build is ~75 min; the
    # tag scope's warm restores shorten re-runs. A timeout fails this job
    # and the verdict reports the build run red.
    timeout-minutes: 170
    permissions:
      actions: write # gh workflow run (the tag-ref dispatch) + gh run list/watch
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - name: Dispatch the platform trigger on the tag ref
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform }}
          RUBY_VERSION: ${{ inputs.ruby_version }}
          ARCH: ${{ inputs.arch }}
          SOURCE_SHA: ${{ needs.era.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo=tamatebako/tebako-runtime-ruby
          wf="build-${PLATFORM}.yml"
          t0="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The thin trigger's publish input defaults to false — the
          # dispatched run builds + gates + uploads a run artifact, and
          # NEVER touches the release.
          gh workflow run "$wf" --repo "$repo" --ref "$TAG" \
            -f ruby_filter="$RUBY_VERSION" -f arch_filter="$ARCH"
          echo "::notice::dispatched $wf on $TAG (ruby $RUBY_VERSION × $ARCH) — waiting for the run to appear"
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            # Created after T0, on the tag's commit, by a dispatch: this
            # run. (A concurrent dispatch on the same tag carries
            # identical inputs, so taking the first match is benign.)
            run_id="$(gh run list --repo "$repo" --workflow "$wf" --limit 20 \
                      --json databaseId,headSha,event,createdAt \
                      --jq "map(select(.createdAt > \"$t0\" and .headSha == \"$SOURCE_SHA\" and .event == \"workflow_dispatch\")) | .[0].databaseId // empty")"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::the dispatched $wf run never appeared on $TAG"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "::notice::watching run $run_id — https://github.com/$repo/actions/runs/$run_id"

      - name: Watch the build run to completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          # --exit-status: a red build fails this job, and the verdict
          # job (always()) reports the run red with its link.
          gh run watch "$RUN_ID" --repo tamatebako/tebako-runtime-ruby --exit-status --interval 60

  verdict:
    name: Verify the rebuilt bytes against the published leg
    needs: [era, rebuild]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read  # gh release download (the published leg)
      actions: read   # gh run download (the build run's artifact)
    steps:
      # The verdict logic rides the DISPATCH ref, never the tag — the tag
      # is the subject under test, the verifier is ours.
      - name: Checkout (the verdict script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby (the rebuilt contract card is YAML)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Render the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RUBY_VERSION: ${{ inputs.ruby_version }}
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
          HOST_ID: ${{ needs.era.outputs.host_id }}
          ERA: ${{ needs.era.outputs.era }}
          REBUILD_RESULT: ${{ needs.rebuild.result }}
          REBUILD_RUN_ID: ${{ needs.rebuild.outputs.run_id || '' }}
        run: bash ci/reproduce-verdict.sh

      - name: Upload the verdict (JSON)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduce-verdict-${{ inputs.tag }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.ruby_version }}
          path: verdict.json
          if-no-files-found: warn
          retention-days: 30

  weekly-watch:
    name: Dispatch the weekly drift watch
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write  # gh workflow run (the self-dispatch)
      contents: read  # gh release list
    steps:
      - name: Dispatch reproduce.yml for the latest release's witness leg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The latest NON-SHARD release tag (a catalog publish shards per
          # ruby line — v0.16.28-ruby4.0, … — and those tags carry a suffix).
          tag="$(gh release list --repo tamatebako/tebako-runtime-ruby --limit 100 --json tagName --jq '.[].tagName' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          [ -n "$tag" ] || { echo "::error::no non-shard release tag found"; exit 1; }
          # The pinned witness leg — ruby 4.0.9 × linux-gnu × x86_64: the
          # arc's E2 twin-run (runs 44983654950 + 45000701327) proved this
          # leg byte-reproduces across runners. Repin when matrix.json's
          # tidy vocabulary moves. The dispatched run is what goes red on
          # drift; this job is green once the dispatch lands.
          gh workflow run reproduce.yml --ref "${GITHUB_REF_NAME}" \
            -f tag="$tag" -f ruby_version=4.0.9 -f platform=linux-gnu -f arch=x86_64
          echo "::notice::dispatched reproduce.yml for $tag (ruby 4.0.9 × linux-gnu × x86_64)"
