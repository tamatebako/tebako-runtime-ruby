# The ONE per-platform build workflow (the multi-staged hierarchy's unit).
# Called by the four thin platform triggers (build-<platform>.yml) and by
# the publish.yml coordinator — never dispatched directly.
#
# Stage 1 (compute): scripts/compute_matrix.rb walks .github/build-graph.yaml
#   against the event's change set and emits THIS platform's legs only —
#   a leg runs because something it reads changed, never because "the
#   workflow fired". An unaffected platform computes `run=false` and the
#   build/publish stages skip (seconds, not a build).
# Stage 2 (link-unit): the v2 link unit (tebako-driver + scoped tfs + the
#   native closure) staged ONCE per platform-arch — the closure depends on
#   the triplet only, never on the ruby version — and handed to the build
#   legs as an artifact. Windows legs still stage in-leg (the build job
#   below) until the first published windows link unit ships.
# Stage 3 (build): the matrix legs, exactly the retired monolith's steps,
#   consuming the staged unit via TEBAKO_RUST_LIBDIR instead of rebuilding
#   the native closure per ruby version.
# Stage 4 (publish): uploads THIS platform's packages; the manifest merge
#   (scripts/upload_release.rb) keeps every other platform's entries, so
#   platforms publish independently. A globally serialized concurrency
#   group makes two simultaneous publishes impossible (the merge is
#   read-modify-write).

name: build-platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: 'windows | linux-gnu | linux-musl | macos'
        required: true
        type: string
      ruby_filter:
        description: 'Dispatch grammar: full | tidy | catalog | comma-separated versions. Empty = the event decides.'
        type: string
        default: ''
      arch_filter:
        description: 'Optional arch slice within the platform (x86_64 | arm64).'
        type: string
        default: ''
      audit:
        description: 'Audit only: no builds, no uploads — verify the release against the expected matrix'
        type: boolean
        default: false
    # The coordinator (publish.yml) reads these to feed upload_release.rb
    # from its single release job — the publish never lives here, so N
    # platform runs never contend for the one manifest merge.
    outputs:
      run:
        value: ${{ jobs.compute.outputs.run }}
      env-matrix:
        value: ${{ jobs.compute.outputs.env-matrix }}
      ruby-matrix:
        value: ${{ jobs.compute.outputs.ruby-matrix }}
      tebako-version:
        value: ${{ jobs.compute.outputs.tebako-version }}

permissions:
  contents: write
  packages: write

env:
  # The .build prefix cache's manual escape hatch: bump when the build
  # recipe changes shape under an unchanged source tarball (the key carries
  # only the tarball's sha256). 3: the msys --enable-shared rearrangement
  # (issue 40) — a stamp-restored tree would keep the static configuration.
  # 4: the msys exe-link order + probe/closure hot-patch set (issue 40) —
  # a cache captured before it holds a pre-ext-build tree and the finalize
  # relink dies on undefined Init_* (the 3.2.4 catalog leg vs its green
  # cache-miss validation leg).
  CACHE_VER: 4
  VERBOSE: no
  RUNTIME_REPO: tamatebako/tebako-runtime-ruby

# One run per (platform, ref, slice): a re-push cancels the stale run of
# the SAME slice; different slices (a debugging dispatch vs the push legs)
# never cancel each other. There is no publish stage here — the coordinator
# (publish.yml) publishes from a single release job, so N platform runs
# never contend for the one manifest merge.
concurrency:
  group: "platform-${{ inputs.platform }}-${{ github.head_ref || github.ref_name }}-${{ inputs.ruby_filter || 'auto' }}-${{ inputs.arch_filter || 'all' }}"
  cancel-in-progress: true

jobs:
  compute:
    name: Compute ${{ inputs.platform }} matrix
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.matrix.outputs.run }}
      why: ${{ steps.matrix.outputs.why }}
      env-matrix: ${{ steps.matrix.outputs.env-matrix }}
      ruby-matrix: ${{ steps.matrix.outputs.ruby-matrix }}
      # The env matrix deduped by (os, arch) — one link-unit leg per
      # platform-arch, never per ruby (the native closure is ruby-free).
      link-unit-matrix: ${{ steps.matrix.outputs.link-unit-matrix }}
      tebako-version: ${{ steps.get-version.outputs.version }}
      container-version: ${{ steps.get-container-version.outputs.version }}
      source-pin: ${{ steps.get-source-pin.outputs.pin }}
      link-unit-release: ${{ steps.get-link-unit-pin.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dependency-tree walk git-diffs the event's before..after —
          # full history, never the depth-1 default.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Get Tebako version
        id: get-version
        run: |
          version=$(cat VERSION)
          echo "Building runtimes for Tebako version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The toolchain container line — an axis INDEPENDENT of the
      # artifact version (contract.yml owns it; the preflight job fails
      # the run in seconds when a referenced tag is missing).
      - name: Get container version
        id: get-container-version
        run: |
          version=$(grep -E '^container_version:' contract.yml | sed -E 's/^container_version: *"([^"]+)".*/\1/')
          [ -n "$version" ] || { echo "::error::contract.yml declares no container_version"; exit 1; }
          echo "Building in toolchain containers $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tamatebako/ruby source release pin the runtimes build from,
      # echoed for traceability. The build job's .build cache keys on each
      # version's OWN tarball sha256 (src_sha256, emitted into the ruby
      # matrix by compute_matrix.rb from the pinned release's SHA256SUMS):
      # a per-line source change re-spends only that line's legs.
      - name: Get tamatebako/ruby source pin
        id: get-source-pin
        run: |
          pin=$(grep -oE 'DEFAULT_RELEASE = "[^"]+"' build/lib/tebako_runtime_builder/source_fetcher.rb | cut -d'"' -f2)
          echo "Building runtimes from tamatebako/ruby source release $pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      # The published link-unit pin (contract.yml link_unit_release): the
      # tebako product release whose prebuilt closure the legs CONSUME as
      # a download instead of building from source. Empty = source build
      # (the driver is moving). ci/link-unit-download.sh owns the fetch.
      - name: Get the link-unit release pin
        id: get-link-unit-pin
        run: |
          pin=$(grep -E '^link_unit_release:' contract.yml | sed -E 's/^link_unit_release: *"([^"]*)".*/\1/')
          echo "Link-unit release pin: '${pin}' (empty = build from source)"
          echo "release=$pin" >> "$GITHUB_OUTPUT"

      # Roadmap 45: fail before the matrix builds anything if contract.yml
      # (the release pipeline's source of truth) and the compiled-in
      # TEBAKO_CONTRACT_VERSION in the runtime driver disagree -- a contract
      # bump edits both in the same commit. Contract 2's driver is
      # crates/tebako-driver in the tebako product repo (the v1
      # tebako-main.cpp is retired); the check reads it via
      # TEBAKO_DRIVER_SRC. Pin to a release tag once the driver ships in
      # one -- main carries contract 2 today.
      - name: Checkout the tebako product repo (the v2 driver source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako-product
          ref: main

      - name: Check contract version agreement
        env:
          TEBAKO_DRIVER_SRC: tebako-product/crates/tebako-driver/src/lib.rs
        run: |
          ./scripts/check_contract_version.rb

      - name: Compute the platform matrix from the dependency tree
        id: matrix
        env:
          MATRIX_RUBY_FILTER: ${{ inputs.ruby_filter }}
          MATRIX_ARCH_FILTER: ${{ inputs.arch_filter }}
        run: |
          ./scripts/compute_matrix.rb --platform ${{ inputs.platform }}

  # FAIL FAST: every container the legs reference must exist BEFORE any
  # leg spends compute. 2026-08-05: a VERSION bump referenced a
  # nonexistent container tag and every leg discovered it ~40 min in
  # ("manifest unknown"). Seconds here, never mid-leg.
  preflight-containers:
    name: Preflight the toolchain containers
    needs: compute
    if: ${{ needs.compute.outputs.run == 'true' && !inputs.audit }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every referenced container manifest exists
        env:
          ENV_MATRIX: ${{ needs.compute.outputs.env-matrix }}
          CONTAINER_VERSION: ${{ needs.compute.outputs.container-version }}
        run: |
          set -u
          names=$(printf '%s' "$ENV_MATRIX" | jq -r '.[].container // empty' | sort -u)
          [ -n "$names" ] || { echo "no containerized legs; nothing to preflight"; exit 0; }
          missing=0
          for c in $names; do
            for arch in amd64 arm64; do
              ref="ghcr.io/tamatebako/tebako-${c}:${CONTAINER_VERSION}-${arch}"
              if docker manifest inspect "$ref" >/dev/null 2>&1; then
                echo "ok: $ref"
              else
                echo "::error::missing toolchain container: $ref"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "::error::preflight failed — publish the containers or fix container_version in contract.yml"; exit 1; }

  # The v2 link unit (image era), staged ONCE per platform-arch:
  # tebako-driver + scoped tfs + the native closure, from the tebako
  # product checkout. tebako-rs OWNS the staging tool
  # (tools/stage_link_unit); the factory STAGES, never re-implements.
  # The closure depends on the triplet only — staging it inside the ruby
  # matrix paid the full native build per version (the catalog's 22 legs
  # per platform-arch; windows paid it per leg until the hoist).
  # Consumption order per leg: the PUBLISHED unit when contract.yml's
  # link_unit_release pins one (ci/link-unit-download.sh — a verified
  # ~30 s download), else the source build: ci/link-unit-posix.sh stages
  # linux-gnu inside ubuntu:20.04 (the glibc 2.31 floor, by
  # construction), linux-musl inside alpine:3.17 (the build container's
  # musl generation), macos on the runner, windows via ci/link-unit.sh
  # (the ucrt64 rules) — once per run on every platform now.
  link-unit:
    name: Stage the v2 link unit (${{ matrix.env.os }} / ${{ matrix.env.arch }})
    needs: compute
    # Same gates as the build legs.
    if: ${{ needs.compute.outputs.run == 'true' && !inputs.audit }}
    runs-on: ${{ matrix.env.host }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{fromJson(needs.compute.outputs.link-unit-matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The pin hit: the published link unit is a verified download, not
      # a build (the closure depends on the triplet + product release,
      # never on a ruby version). A miss (pin empty, or the platform not
      # published) falls through to the source build below.
      - name: Download the published link unit (pin hit)
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/link-unit-download.sh ${{ matrix.env.os }} ${{ matrix.env.arch }} "${{ needs.compute.outputs.link-unit-release }}"

      - name: Checkout the tebako product repo (the link unit source)
        if: steps.published.outputs.hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako-rs
          ref: main
      - name: Checkout dwarfs-rs (link-unit sibling path dep)
        if: steps.published.outputs.hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive
      # The product repo's contract tests dev-depend on limnifs-write via a
      # sibling path (spec 20, tebako-rs tests/contract ->
      # ../../../../limnifs/limnifs/limnifs-write): EVERY cargo invocation
      # on the tebako-rs workspace (the rust-cache metadata probe included)
      # fails without it. The expected location is a "limnifs" directory
      # holding the limnifs/limnifs repo beside the workspace (the musl
      # container's /mnt maps to the same host dir). Clone it until
      # tebako-rs ships its own answer (a release pin or an in-repo dep).
      - name: Checkout limnifs (contract-tests sibling path dep)
        if: steps.published.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sibling="$(pwd)/../limnifs"
          mkdir -p "$sibling"
          [ -d "$sibling/limnifs/.git" ] || git clone --quiet --depth 1 https://github.com/limnifs/limnifs "$sibling/limnifs"
          test -f "$sibling/limnifs/limnifs-write/Cargo.toml"
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        if: steps.published.outputs.hit != 'true' && matrix.env.os == 'macos'
      # The warmers below key on (os, arch[, the vcpkg closure hash]) and
      # NOTHING else — this job has no ruby dimension, so no key ever
      # carries a ruby version (spec-locked in build_workflow_spec.rb).
      - name: Cache the cargo target dir (link unit)
        if: steps.published.outputs.hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            tebako-rs
          # link-unit2-: the musl dwarfs-t build tree is configured with
          # CXXFLAGS baked in (the cstddef shim) — the v1 entries hold a
          # shimless CMakeCache that would silently win over the env.
          key: link-unit2-${{ matrix.env.os }}-${{ matrix.env.arch }}
      # The archive caches are per flavor on purpose: a floor-built gnu
      # archive, a musl archive, and a macos archive never serve each other.
      - name: Cache vcpkg package archives (link unit, macos)
        if: steps.published.outputs.hit != 'true' && matrix.env.os == 'macos'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/vcpkg
          key: vcpkg-archives-linkunit-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-linkunit-${{ matrix.env.os }}-${{ matrix.env.arch }}-
          # Content-addressed port archives cannot poison a later run;
          # a failed leg keeps its progress instead of restarting cold.
          save-always: true
      - name: Cache vcpkg package archives (link unit, container legs)
        if: steps.published.outputs.hit != 'true' && matrix.env.container != null
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-linkunit-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-linkunit-${{ matrix.env.os }}-${{ matrix.env.arch }}-
          save-always: true
      # The musl staging container's source-built cmake (3.17's stock
      # 3.24 is too old for the boost 1.90 ports; built once per arch).
      - name: Cache the musl cmake build (link unit)
        if: steps.published.outputs.hit != 'true' && matrix.env.os == 'linux-musl'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tebako-cmake-musl-${{ matrix.env.arch }}
          key: cmake-musl-3.31.8-${{ matrix.env.arch }}
          save-always: true
      - name: Stage the POSIX link unit
        if: steps.published.outputs.hit != 'true' && matrix.env.os != 'windows'
        env:
          # Only the macos baseline restore needs it (gh release download);
          # the container flavors build the ports in-leg by design.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Everything lives in ci/link-unit-posix.sh (reviewed,
        # shellcheck-able) — never inline run-blocks.
        run: sh ci/link-unit-posix.sh ${{ matrix.env.os }} ${{ matrix.env.arch }}

      # The windows source staging (the pin's miss path): the steps the
      # build legs carried in-matrix before the hoist — once per run
      # here, never per ruby version again. The checkouts/caches above
      # are shared with POSIX; these are the ucrt64-only provisions.
      - name: Setup MSys
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: true
      - name: Install pacman packages
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        shell: msys2 {0}
        run: |
          pacman -Syu --needed --noconfirm git tar bison flex pactoys
          pacboy sync --needed --noconfirm cmake:p diffutils:p          \
            dlfcn:p ninja:p                                             \
            gtest:p autotools:p ncurses:p ruby:p toolchain:p openssl:p  \
            make:p libyaml:p libxslt:p
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        with:
          targets: x86_64-pc-windows-gnu
      - name: Set up vcpkg for the link unit
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root
      # run-vcpkg@v11 injects VCPKG_BINARY_SOURCES=clear;x-gha,readwrite,
      # and vcpkg removed x-gha (2025.06) — that spec is zero binary cache.
      # The override is the org's GitHub Packages NuGet feed (details in
      # ci/vcpkg-nuget-cache.sh).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        shell: bash
        env:
          # First-push of a new package id CANNOT be done by GITHUB_TOKEN
          # (GitHub quirk: 403 on creation; community#159893) — the org
          # secret (classic PAT, write:packages) owns creation when present;
          # GITHUB_TOKEN remains the read path and the whole fallback.
          GH_TOKEN: ${{ secrets.TEBAKO_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh
      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"
      - name: Build + stage the windows-gnu link unit
        if: matrix.env.os == 'windows' && steps.published.outputs.hit != 'true'
        # Git-bash, and NO msys2 bin dir on PATH: vcpkg's downloaded
        # msys2 (make/perl) ABI-clashes with the setup-msys2 install when
        # both are on PATH (openssl's make install died in a perl eval
        # crash — three legs lost). The msys2 ruby is invoked by
        # ABSOLUTE path only; the C++ runtimes static-link (several mingw
        # installs on the runner make DLL resolution nondeterministic).
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
          # Trailing -lmsvcrt: rustc's -nodefaultlibs late-lib order ends
          # -lmsvcrt -lmingwex -luser32 -lkernel32, so libmingwex's compat
          # _assert.o (pulled at the LAST -lmingwex) never sees the
          # __imp___msvcrt_assert provider behind it (probe-proven:
          # libmsvcrt.a carries it; gcc's own tail keeps msvcrt after
          # mingwex, rustc's does not). The end-of-line -lmsvcrt restores
          # the invariant.
          RUSTFLAGS: -C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt
        # Everything lives in ci/link-unit.sh (reviewed, shellcheck-able) —
        # never inline run-blocks; they get string-edited and break silently.
        run: bash ci/link-unit.sh
      - name: Dump vcpkg build logs on failure
        if: failure() && matrix.env.os == 'windows'
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/*-out.log .vcpkg-root/buildtrees/*/*-err.log; do
            [ -s "$f" ] || continue
            echo "=== $f ==="
            tail -30 "$f"
          done

      # The handoff to the build legs: the staged unit
      # (.build/link-unit — libtebako_driver.a + libtfs.a + closure/*.a +
      # include/) travels as a same-run artifact; each build leg downloads
      # it into the exact workspace path its TEBAKO_RUST_LIBDIR names.
      - name: Upload the staged link unit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-unit-${{ matrix.env.os }}-${{ matrix.env.arch }}
          path: .build/link-unit
          retention-days: 1

  build:
    name: Build runtime package for ${{ matrix.env.os }} / ${{ matrix.env.arch }} / Ruby ${{ matrix.ruby.version }}
    needs: [compute, preflight-containers, link-unit]
    # Audit runs publish-shaped verification without spending a build.
    # always() + the explicit result check: a skipped link-unit (the
    # audit path) must not take the legs down with it, and a link-unit
    # failure skips the legs here by name instead of 40 minutes into the
    # ruby link.
    if: ${{ always() && !cancelled() && needs.compute.outputs.run == 'true' && !inputs.audit && (needs.link-unit.result == 'success' || needs.link-unit.result == 'skipped') }}
    runs-on: ${{ matrix.env.host }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{fromJson(needs.compute.outputs.env-matrix)}}
        ruby: ${{fromJson(needs.compute.outputs.ruby-matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Create folder for runtime packages
        run: |
          mkdir -p runtime-packages

      # Per-(platform, ruby) cache of the whole build prefix (.build), which
      # holds both the ruby-independent deps and the ruby-specific build
      # trees. The key carries the version's OWN source tarball sha256
      # (src_sha256, emitted into the ruby matrix from the pinned
      # tamatebako/ruby release's SHA256SUMS): the sha moves only when that
      # version's patched source moved, so a per-line patch change or a pin
      # bump re-spends only the affected versions' legs, never the whole
      # matrix (fault isolation). A prefix restored under the same key was
      # built from exactly the verified bytes the SourceFetcher downloads --
      # the cache key and the download-time sha256 verification share the
      # same source of truth. A prefix built from a DIFFERENT tarball is
      # stale by definition, so the ExternalProject download step re-runs
      # and re-extracts the new source over the restored ruby tree -- a
      # remove+rename that does not survive Windows file locking ('file
      # RENAME failed ... Access is denied'), and a full rebuild the cache
      # buys nothing for anyway. Caches are immutable per key, so a stale
      # entry could never repair itself; keyed on the tarball sha, a source
      # move is a clean cache miss instead. CACHE_VER stays the manual
      # escape hatch. Host-native jobs only: container jobs build inside
      # the CI container image whose toolchain is baked into the image
      # itself, so there is no host-side path to cache (the container
      # image is the cache).
      # save-always: a boot-smoke failure must NEVER poison the cache — the
      # default (save on success only) meant every red leg left the next one
      # cold (~60 min of rebuild per iteration, the msys campaign's tax).
      - name: Cache build prefix
        if: matrix.env.container == null
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: tebako-runtime-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ matrix.ruby.version }}-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.src_sha256 }}-v${{ env.CACHE_VER }}
          save-always: true

      # The v2 link unit (image era): staged ONCE per platform-arch by
      # the link-unit job above (a pin-hit verified download, or a source
      # build — the native closure depends on the triplet, never on the
      # ruby version) and downloaded into the exact workspace path
      # TEBAKO_RUST_LIBDIR names below, on every platform.
      # The .build prefix cache may restore a link-unit/ staged by an
      # older run — drop it first so the download lands on a clean
      # directory (an overlay merge would link stale closure archives).
      - name: Clean any cache-restored link unit
        run: rm -rf .build/link-unit

      - name: Download the staged link unit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: link-unit-${{ matrix.env.os }}-${{ matrix.env.arch }}
          path: .build/link-unit

      # Fail fast BY NAME when the handoff is incomplete — a missing unit
      # must stop the leg here, not an hour into the ruby build with a
      # missing-archive error from the link.
      - name: Assert the staged link unit is complete
        shell: bash
        run: |
          set -euo pipefail
          unit=.build/link-unit
          for f in libtebako_driver.a libtfs.a include/tebako/fs/c_api.h; do
            test -s "$unit/$f" || { echo "::error::missing link-unit input $unit/$f — the link-unit job's artifact is incomplete"; exit 1; }
          done
          compgen -G "$unit/closure/*.a" > /dev/null || { echo "::error::$unit carries no closure/*.a — the link-unit job's artifact is incomplete"; exit 1; }
          echo "staged link unit OK: $(find "$unit/closure" -name '*.a' | wc -l) closure archives"

      - name: Build runtime using ci container
        if: matrix.env.container != null
        run: |
          # The container images are published per (version × arch) by
          # tebako-ci-containers' build-containers.yml: :<ver>-amd64 /
          # :<ver>-arm64. The plain :<ver> tag is NOT published (an
          # arch-ambiguous reference raced the two arch legs).
          case "${{ matrix.env.arch }}" in
            x86_64) arch_suffix=amd64 ;;
            arm64)  arch_suffix=arm64 ;;
            *) echo "::error::no container arch suffix for '${{ matrix.env.arch }}'"; exit 1 ;;
          esac
          container="ghcr.io/tamatebako/tebako-${{ matrix.env.container }}:${{ needs.compute.outputs.container-version }}-${arch_suffix}"
          echo "Building runtime for Ruby ${{ matrix.ruby.version }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          # TEBAKO_RUST_LIBDIR: the staged v2 link unit (downloaded from
          # the link-unit job above) — the builder's rust_driver? switch
          # then links the scoped Rust staticlibs instead of the C++ driver.
          # On failure, surface the ext extconf probe logs (mkmf.log) — the
          # container's build tree is ephemeral, so copy them to the
          # workspace first. These show exactly which probe failed and why.
          if ! docker run -v ${{github.workspace}}:/mnt/w \
            -e TEBAKO_RUST_LIBDIR=/mnt/w/.build/link-unit \
            -t $container \
            /mnt/w/tools/build_runtime --ruby "${{ matrix.ruby.version }}" --output "/mnt/w/runtime-packages/$runtime" \
            --prefix /root/.build ${{ matrix.env.os == 'linux-gnu' && '--patchelf' || '' }}; then
            echo "::warning::build failed — dumping ext extconf probe logs"
            docker run --rm -v ${{github.workspace}}:/mnt/w $container bash -c '
              find /root/.build/deps/src -path "*/ext/*/mkmf.log" | while read -r f; do
                echo "=== $f ==="; tail -40 "$f"
              done' || true
            exit 1
          fi

      - name: Select XCode
        if: matrix.env.os == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.env.xcode }}

      - name: Setup MSys
        if: matrix.env.os == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: true

      - name: Install pacman packages
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          pacman -Syu --needed --noconfirm git tar bison flex pactoys
          pacboy sync --needed --noconfirm cmake:p diffutils:p          \
            dlfcn:p ninja:p                                             \
            gtest:p autotools:p ncurses:p ruby:p toolchain:p openssl:p  \
            make:p libyaml:p libxslt:p

      # The v2 link unit (scoped staticlibs + the mingw closure) stages
      # ONCE per run in the link-unit job above on EVERY platform — a
      # pin-hit verified download, or a source build — and the legs
      # download it below. No closure work lives in the ruby matrix.

      - name: Setup Ruby
        if: matrix.env.container == null && matrix.env.os != 'windows'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: false

      # The Brewfile is the pin: --no-upgrade stops brew from upgrading
      # already-installed formulas mid-matrix (two legs of the same build
      # resolving different versions when brew moves under us). A formula
      # bump is an edit to ./Brewfile in a PR, never a surprise.
      - name: Install brew packages
        if: matrix.env.os == 'macos'
        run: |
          brew bundle --no-upgrade -f
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      - name: Build runtime
        if: matrix.env.container == null && matrix.env.os != 'windows'
        env:
          # The staged v2 link unit (downloaded from the link-unit job above).
          TEBAKO_RUST_LIBDIR: ${{ github.workspace }}/.build/link-unit
        run: |
          echo "Building runtime for Ruby ${{ matrix.ruby.version }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          tools/build_runtime --ruby "${{ matrix.ruby.version }}" --output "runtime-packages/$runtime" --prefix .build

      - name: Build runtime on Windows
        if: matrix.env.container == null && matrix.env.os == 'windows'
        shell: msys2 {0}
        env:
          TEBAKO_RUST_LIBDIR: ${{ github.workspace }}/.build/link-unit
        run: |
          git config --global core.longpaths true
          echo "Building runtime for Ruby ${{ matrix.ruby.version }} on ${{ matrix.env.os }}/${{ matrix.env.arch }}"
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          tools/build_runtime --ruby "${{ matrix.ruby.version }}" --output "runtime-packages/$runtime" --prefix .build

      # Diagnostics for tamatebako/tebako#345: on failure, surface the
      # ext/openssl mkmf log (which lib/header did extconf pick, and why did
      # the X509 accessor probes fail) and the generated ruby.exe link rule
      # (does it carry the --start-group wrapper) — cheap, only fires red
      - name: Dump diagnostics on failure (Windows)
        if: failure() && matrix.env.container == null && matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          find .build/deps/src -path "*/ext/openssl/mkmf.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
          # ext/socket: the link-type probes (socketpair vs the compiled-out
          # rsock_sock_s_socketpair — the ucrt DLL link failure class)
          find .build/deps/src -path "*/ext/socket/mkmf.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
          # the config.status substitution state at failure: is the closure in
          # MAINLIBS/SOLIBS/LIBRUBYARG_STATIC, and did a recheck revert it
          # (configure newer than config.status is the autoconf trigger)
          find .build/deps/src -maxdepth 2 -name config.status -exec sh -c '
            echo "== $1:"; grep -h "^S\[\"MAINLIBS\"\]\|^S\[\"SOLIBS\"\]\|^S\[\"LIBRUBYARG_STATIC\"\]" "$1" | cut -c1-140
          ' _ {} \; || true
          find .build/deps/src -maxdepth 2 -name config.status -exec ls -la --time-style=full-iso {} \; 2>/dev/null | awk "{print \$6, \$7, \$NF}" | head -4 || true
          # the DLL export surface: does the fragment carry the driver's
          # tebako_driver_* entries, and does the import lib export them
          # (the ruby.exe link binds them from the import lib)
          find .build/deps/src -name "tebako-dll-exports.def" -exec sh -c '
            echo "== $1: driver/fs export lines:"; grep -nE "tebako_driver|tebako_fs_|tebako_mount|tebako_original" "$1" | head -20; echo "(count: $(wc -l < "$1"))"
          ' _ {} \; || true
          find .build/deps/src -name "libx64-ucrt-ruby*.dll.a" -exec sh -c '
            echo "== $1: import-lib driver exports:"; nm -g "$1" 2>/dev/null | grep -E "tebako_driver_boot|tebako_driver_contract_version" || echo "(tebako_driver_* NOT exported)"
          ' _ {} \; || true
          find .build/deps/src -maxdepth 2 -name Makefile -exec sh -c '
            echo "== $1: start-group refs:"; grep -n "start-group" "$1" || echo "(none)"
            echo "== $1: ruby.exe link rule region:"; grep -n -B4 -A6 "EXTOBJS.*-o \$@)" "$1" || true
            echo "== $1: LIBS/MAINLIBS definitions:"; grep -n "^LIBS\|^MAINLIBS\|^EXTLIBS" "$1" || true
          ' _ {} \; || true
          # the ExternalProject-swallowed inner build log (the make error's
          # real stderr never reaches the CI output otherwise)
          find .build/deps/src -name "*-build-*.log" -o -name "*-err.log" | while read -r f; do
            echo "=== $f (tail) ==="; tail -60 "$f" || true
          done

      # Issue 40 boot diagnostics (windows): the shared build's boot hangs
      # are silent (the boot-smoke probe exits the process when it runs, so
      # a timeout means the hang is at load, in the driver, or in ruby
      # init). Print the PE import tables and boot the exe three ways with
      # stdin closed and a hard timeout: bare (exe+DLL load), image-mounted
      # with the smoke's probe (the exact smoke case), image-mounted bare
      # (driver dispatch without the probe). Runs BEFORE the boot smoke so
      # the evidence is in the same leg; never fails by itself.
      - name: Boot diagnostics (windows)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          # Informational only — a bare boot returns 127 (the exe's ruby DLL
          # is materialized by the boot smoke, not present here), and this
          # step must never fail the leg on it.
          set +e
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          exe="runtime-packages/$runtime"
          [ -s "$exe" ] || exe="$exe.exe"
          probe="$PWD/build/lib/tebako_runtime_builder/boot_smoke/probe.rb"
          echo "== runtime-packages:"; ls -la runtime-packages/ || true
          echo "== exe imports:"; objdump -p "$exe" | grep -i "DLL Name" || true
          pe=$(ls runtime-packages/x64-*-ruby*.dll 2>/dev/null | head -1 || true)
          echo "== PE-named dll in place: ${pe:-NONE (boot smoke materializes it)}"
          pkgdll="${exe%.exe}.dll"
          [ -f "$pkgdll" ] && { echo "== package dll imports:"; objdump -p "$pkgdll" | grep -i "DLL Name" || true; }
          echo "== bare boot (no image), stdin closed, 25s:"
          timeout --preserve-status 25 "$exe" < /dev/null 2>&1 | tail -15; echo "bare exit: ${PIPESTATUS[0]}"
          echo "== probe boot (smoke case), stdin closed, 25s:"
          TEBAKO_RUNTIME_IMAGE="$exe.tfs" RUBYOPT="-r$probe" TEBAKO_BOOT_PROBE=boot TEBAKO_BOOT_MOUNT_POINT=A:/t \
            timeout --preserve-status 25 "$exe" < /dev/null 2>&1 | tail -15; echo "probe exit: ${PIPESTATUS[0]}"
          echo "== image boot (no probe), stdin closed, 25s:"
          TEBAKO_RUNTIME_IMAGE="$exe.tfs" timeout --preserve-status 25 "$exe" < /dev/null 2>&1 | tail -15; echo "image exit: ${PIPESTATUS[0]}"
          exit 0

      # The build emits TWO artifacts per leg since item 30: the runtime
      # executable and its filesystem image (<runtime>.tfs, the layout
      # tree in DwarFS form, writer defaults) -- THREE on windows since
      # issue 40 (<runtime>.dll, the shared libruby the exe imports).
      # Fail the leg loudly when either is missing rather than discovering
      # it at release assembly.
      - name: Verify runtime packages
        shell: bash
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          exe="runtime-packages/$runtime"
          # The windows artifact name (.exe suffix or not) is still settling
          # (no windows assets shipped yet) -- accept either spelling.
          [ -s "$exe" ] || exe="$exe.exe"
          test -s "$exe" || { echo "::error::missing runtime executable runtime-packages/$runtime[.exe]"; exit 1; }
          img="runtime-packages/$runtime.tfs"
          test -s "$img" || { echo "::error::missing runtime filesystem image $img"; exit 1; }
          ls -l "$exe" "$img"

      # Issue 40: the shared-build artifact set -- the exe must import the
      # ruby DLL by its PE name and the DLL must export the tebako_fs_*
      # surface (the mkexports def plus the appended tebako_* fragment),
      # the two facts the --disable-shared build failed.
      - name: Verify the ruby DLL artifact (windows)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          exe="runtime-packages/$runtime"
          [ -s "$exe" ] || exe="$exe.exe"
          dll="runtime-packages/$runtime.dll"
          test -s "$dll" || { echo "::error::missing ruby DLL $dll (the --enable-shared msys build, issue 40)"; exit 1; }
          objdump -p "$exe" | grep -F "DLL Name: x64-ucrt-ruby" \
            || { echo "::error::$exe imports no x64-ucrt-ruby*.dll (issue 40)"; exit 1; }
          objdump -p "$dll" | grep -F "tebako_fs_mount" \
            || { echo "::error::$dll exports no tebako_fs_* surface (the export fragment did not land, issue 40)"; exit 1; }
          echo "ruby DLL wired: $(basename "$exe") imports it, it exports tebako_fs_*"

          # Issue 40's own proof class: the env image's three dynamic
          # extensions (debug/racc/rbs -- the --disable-shared era had them
          # import a nonexistent ruby.exp.dll) must import the REAL ruby
          # DLL. objdump each .so in the assembled layout tree (.build/o/s
          # before packing) and require the import on every one found.
          echo "== env image dynamic extensions' imports:"
          found=0
          while IFS= read -r so; do
            found=$((found + 1))
            echo "  $so"
            objdump -p "$so" | grep -F "DLL Name: x64-ucrt-ruby" >/dev/null \
              || { echo "::error::$so does not import the ruby DLL (issue 40)"; exit 1; }
          done < <(find .build/o/s/lib/ruby/gems -path "*/extensions/*" -name "*.so" 2>/dev/null)
          [ "$found" -ge 3 ] || { echo "::error::expected the image's dynamic extensions (debug/racc/rbs) in .build/o/s, found $found"; exit 1; }
          echo "all $found dynamic extensions import the ruby DLL by name"

      # Spec 18 S51 (C4): the nm provenance assert — the exe's tebako_main
      # must resolve from the fs TU (the CMake-built libtebako-fs.a),
      # never from the toolchain stub (its tebako_main returns 0 without
      # mounting: a shadowed link boots as a plain interpreter). Asserted
      # on the BUILD-TREE ruby.exe: strip -S on PE removes the COFF
      # symbol table (the shipped exe is the same link, stripped).
      # Everything lives in the committed script — never inline run-blocks.
      - name: Check tebako_main symbol provenance (S51)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        run: |
          bash ci/check_symbol_provenance.sh \
            --exe ".build/deps/src/_ruby_${{ matrix.ruby.version }}/ruby.exe" \
            --stub-archive .build/deps/lib/libtebako-fs.a \
            --real-archive .build/o/libtebako-fs.a

      # Spec 18 S51 (C4), POSIX legs: the same assert on the shipped exe
      # (strip -S keeps the symbol table on ELF and Mach-O). Host builds
      # (macos) also assert the archive side — the stub archive must be
      # gone and the real archive's member provenance must be the fs TU;
      # container legs built inside the image, so only the exe side is
      # host-visible there.
      - name: Check tebako_main symbol provenance (S51)
        if: matrix.env.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako-version }}-${{ matrix.ruby.version }}-${{ matrix.env.host_id }}"
          args=(--exe "runtime-packages/$runtime")
          if [ "${{ matrix.env.container == null }}" = "true" ]; then
            args+=(--stub-archive .build/deps/lib/libtebako-fs.a --real-archive .build/o/libtebako-fs.a)
          fi
          bash ci/check_symbol_provenance.sh "${args[@]}"

      # Roadmap item 19: boot-smoke the freshly built runtime BEFORE the
      # artifacts leave the leg. spec/boot_smoke_spec.rb (tag :boot_smoke)
      # boots the executable in the spec-17 smoke form (TEBAKO_RUNTIME_IMAGE
      # = the leg's own .tfs, no --tebako-entry -- the driver mounts and
      # starts the interpreter with its own args) and asserts from inside
      # the packaged context: the memfs syscall surface (stat/btime, image
      # IO, gem home/bundler, flock), code execution FROM the mount, the
      # openssl native-extension canary (TEBAKO_SMOKE_EXPECT_OPENSSL
      # records the leg's expectation -- issue 40), the deploy-direction
      # IO.copy_stream (the io.c zero-copy EBADF class), and the era-2
      # release card + contract version the manifest entry will carry.
      # A red boot-smoke skips the upload below, and
      # the release job's completeness gate then fails the run loudly --
      # a drifted runtime never ships. Container legs run the class on the
      # host: the gnu/musl executables run on the ubuntu host kernel
      # directly. The bundler env stays inside these steps so the runtime
      # build above never sees a bundle exec RUBYOPT.
      - name: Setup Ruby for boot-smoke (container legs)
        if: matrix.env.container != null && matrix.env.os != 'linux-musl'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Boot-smoke the fresh runtime
        if: matrix.env.os != 'windows' && matrix.env.os != 'linux-musl'
        shell: bash
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
          # The openssl canary's recorded expectation (issue 40 class):
          # openssl is statically linked into the runtime, so require
          # "openssl" must LOAD on every POSIX leg today -- a 'fail' probe
          # here is a broken runtime, the leg fails, and the upload below
          # never happens. The spec fails on ANY drift from this record,
          # either way.
          TEBAKO_SMOKE_EXPECT_OPENSSL: ok
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3
          bundle exec rspec --tag boot_smoke --format documentation

      # The musl runtime is dynamic-musl BY DESIGN (PT_INTERP
      # /lib/ld-musl-<arch>.so.1; the released v0.15.9 binaries are the
      # same shape) — and it links against the musl of the alpine CI
      # container it was built in. Execing it on the ubuntu host fails
      # twice over: no loader at all (ENOENT naming the binary), and even
      # with ubuntu's `musl` package installed, "Error relocating:
      # qsort_r/crypt_r: symbol not found" — ubuntu 22.04's musl 1.2.2
      # predates symbols the alpine-built binary needs. The truthful
      # environment is a real musl userland of the same generation, so
      # the musl legs smoke inside an alpine container. (The musl symbol
      # floor for DISTRIBUTION — musl >= 1.2.3 / alpine >= 3.17 — is a
      # separate, documented decision; TODO.v2-1/11.)
      - name: Boot-smoke the fresh runtime (musl legs, in alpine)
        if: matrix.env.os == 'linux-musl'
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
          # The openssl canary's recorded expectation -- POSIX legs enforce
          # (see the host-leg step above); the musl runtime links openssl
          # statically like every POSIX build.
          TEBAKO_SMOKE_EXPECT_OPENSSL: ok
        run: |
          set -euo pipefail
          docker run --rm -v ${{ github.workspace }}:/mnt/w -w /mnt/w \
            -e TEBAKO_RUNTIME_ROOT \
            -e TEBAKO_SMOKE_EXPECT_OPENSSL \
            alpine:3.21 sh -c '
              set -e
              apk add --no-cache ruby ruby-dev build-base ruby-bundler >/dev/null
              bundle install --jobs 4 --retry 3
              bundle exec rspec --tag boot_smoke --format documentation'

      - name: Boot-smoke the fresh runtime (Windows)
        if: matrix.env.os == 'windows'
        shell: msys2 {0}
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
          # openssl is STATICALLY linked into the runtime (not a dynamic
          # ext), so require "openssl" must LOAD on every windows leg
          # today, shared build or not — the 4.0.6 probe proves it
          # (OpenSSL 3.6.0). A 'fail' probe here is a broken runtime, the
          # leg fails, the upload never happens. Issue 40's dynamic-ext
          # tripwire rides the cparse.so check (load_native_extension),
          # never this one.
          TEBAKO_SMOKE_EXPECT_OPENSSL: ok
        run: |
          set -euo pipefail
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
          bundle exec rspec --tag boot_smoke --format documentation

      - name: Upload runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.env.os }}-${{ matrix.env.arch }}-${{ matrix.ruby.version }}
          # The boot smoke materializes the PE-named ruby DLL copy
          # (x64-ucrt-ruby<ABI>.dll) next to the exe; it never leaves the
          # leg -- the release carries the DLL under the unique package
          # name (<runtime>.dll), so two same-ABI legs never collide in
          # the merged publish workspace (issue 40).
          path: |
            runtime-packages
            !runtime-packages/x64-*-ruby*.dll
          retention-days: 1
