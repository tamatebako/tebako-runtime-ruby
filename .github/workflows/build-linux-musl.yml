# The linux-musl trigger — deliberately thin. Every event hands the change
# set to _build-platform.yml, whose compute stage walks
# .github/build-graph.yaml and decides whether ANY windows leg runs
# (a docs-only push computes `run=false` in seconds; another platform's
# change never builds here). Triggers stay broad so the dependency tree —
# not a duplicated paths list — is the single source of truth.

name: build-linux-musl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ruby_filter:
        description: 'Rubies: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (e.g. "x86_64")'
        type: string
        default: 'all'

jobs:
  linux-musl:
    uses: ./.github/workflows/_build-platform.yml
    with:
      platform: linux-musl
      ruby_filter: ${{ inputs.ruby_filter || '' }}
      arch_filter: ${{ inputs.arch_filter || '' }}
    secrets: inherit
