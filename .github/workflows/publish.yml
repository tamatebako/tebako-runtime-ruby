# The release coordinator — the explicit, operator-facing entry points:
#
#   workflow_dispatch: the three first-class slice shapes —
#       one ruby on every platform   (ruby_filter=<version>, platform=all)
#       one platform, every ruby     (ruby_filter=full|tidy|catalog, platform=<one>)
#       one ruby on one platform     (ruby_filter=<version>, platform=<one>)
#     plus the era baseline (ruby_filter=catalog, platform=all).
#   repository_dispatch "tebako release": a new tamatebako/ruby source pin
#     landed — compute_matrix.rb diffs the two pins' SHA256SUMS and only
#     the versions whose tarballs moved rebuild (a 4.0-only source release
#     rebuilds 4.0.x), on every platform, and publishes.
#
# Every leg fans out to _build-platform.yml to BUILD, and — spec 13 §2a's
# de-rendezvous — to PUBLISH and SIGN from each leg's own publish job
# (#190's split): the leg that built a package uploads its write-once
# names (payload + .sha256 sidecars + .manifest.json shard) and signs
# every served name, publishing the bytes the build job handed off as an
# immutable in-run artifact. No shared mutable file exists anymore (the
# monolithic manifest.json / SHA256SUMS.txt are gone — each shard IS its
# release-index entry, and the monoliths derive consumer-side), so N legs
# publish concurrently with zero rendezvous. The AUDIT lives at the tail
# of each _build-platform.yml run (spec 36 §6): the duty is per-platform
# by construction, and the platform run owns the matrix truth — never a
# recomputation, never a cross-run stale read. What remains here is the
# ONE release job per coordinator run: the selected-platforms-green check
# and the tpkg-registry.yaml mirror renders + bot PRs (spec 04 §2), one
# per shard tag. And a force_rebuild republication passes through the
# prepare-release job first (#189): the release OBJECT is recreated under
# the kept tag, so every publish leg is a pure create on a free
# namespace — the per-asset delete→re-upload wedge never gets triggered.
#
# Spec 36 §6's topology: a CATALOG publish (ruby_filter=catalog, no
# release_tag override) derives its per-line shard tags itself —
# v<VERSION>-ruby<line> per ruby line in .github/matrix.json's catalog
# vocabulary, no operator input. The plan job emits the shard list; the
# platform callers matrix over it; the release job renders one registry
# bot PR per shard tag. The release_tag input remains as the override.
name: publish

on:
  workflow_dispatch:
    inputs:
      ruby_filter:
        description: 'Rubies: "full" (line tips), "tidy", "catalog" (every published version), or comma-separated versions'
        type: string
        default: 'full'
      platform:
        description: 'Platform slice: "all" or one of windows | linux-gnu | linux-musl | macos'
        type: string
        default: 'all'
      arch_filter:
        description: 'Optional arch slice within each platform (x86_64 | arm64)'
        type: string
        default: 'all'
      publish:
        description: 'Publish this run''s packages to the release'
        type: boolean
        default: true
      force_rebuild:
        description: 'Republication: recreate the release OBJECT under the kept tag, then publish fresh (#189 — the one exception to per-name byte-immutability, and never a per-asset delete)'
        type: boolean
        default: false
      audit:
        description: 'Audit only: verify the release against the expected matrix, no builds/uploads'
        type: boolean
        default: false
      registry_only:
        description: 'Registry only: render + publish the registry from the release as it stands (needs registry_version; no builds, no audit gate)'
        type: boolean
        default: false
      registry_version:
        description: 'The published tebako version to render for (e.g. 0.16.27) — required with registry_only'
        type: string
        default: ''
      release_tag:
        description: 'Host the release under this tag instead of v<VERSION> — a release object caps at 1000 assets, so a catalog publish shards per ruby line (v0.16.28-ruby4.0, …). Artifact names stay version-branded; only the tag moves. Empty = v<VERSION>.'
        type: string
        default: ''
  repository_dispatch:
    types: ['tebako release']

jobs:
  # Spec 36 §6's topology derivation: a catalog publish (ruby_filter=
  # catalog, no release_tag override) shards itself across per-line
  # release tags — v<VERSION>-ruby<line> per ruby line in the catalog
  # vocabulary, no operator input. Every other run is ONE shard carrying
  # the inputs verbatim, so the platform callers and the release job
  # consume the same plan either way.
  plan:
    name: Plan the publish topology
    runs-on: ubuntu-latest
    if: ${{ !inputs.registry_only }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          RUBY_FILTER: ${{ inputs.ruby_filter }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${RUBY_FILTER:-}" = "catalog" ] && [ -z "${RELEASE_TAG:-}" ]; then
            ruby -rjson -e '
              catalog = JSON.parse(File.read(".github/matrix.json")).fetch("ruby").fetch("catalog")
              version = File.read("VERSION").strip
              shards = catalog.group_by { |v| v.split(".").first(2).join(".") }.map do |line, rubies|
                { "ruby_filter" => rubies.join(","), "release_tag" => "v#{version}-ruby#{line}" }
              end
              puts "catalog publish derives #{shards.size} line shards: #{shards.map { |s| s["release_tag"] }.join(", ")}"
              File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |f| f.puts "shards=#{JSON.generate(shards)}" }
            '
          else
            echo "shards=[{\"ruby_filter\":\"${RUBY_FILTER:-}\",\"release_tag\":\"${RELEASE_TAG:-}\"}]" >> "$GITHUB_OUTPUT"
          fi

  # #189: a force_rebuild republication never deletes individual assets —
  # a deleted name 422-blocks re-uploads for hours server-side, and the
  # wedge's scope is the release OBJECT (proven by probe: a fresh object
  # under the same tag accepts the same names immediately). So a forced
  # republication recreates the release object under the kept tag BEFORE
  # any leg publishes; every publish leg on a fresh object is a pure
  # create (the gem's race-safe create arbitrates the legs' concurrent
  # re-creation). Non-forced runs skip this job entirely (payload assets
  # stay byte-immutable per name).
  prepare-release:
    name: Recreate the release object (force_rebuild)
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.registry_only && !inputs.audit && inputs.publish && inputs.force_rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the release object(s), keeping the tag(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          # Every shard tag's object is recreated (a sharded catalog's
          # republication recreates each line's object); the single-shard
          # case is exactly the old behavior.
          echo "${SHARDS:-[{\"release_tag\":\"\"}]}" | jq -r '.[].release_tag' | while read -r shard_tag; do
            tag="${shard_tag:-v$(cat VERSION)}"
            # Idempotent: a missing object is already the recreated state
            # (a re-run after a mid-air death). --cleanup-tag=false (the
            # default, spelled out) keeps the tag on its commit.
            gh release delete "$tag" --yes --cleanup-tag=false 2>/dev/null || \
              echo "no release object for $tag — already the recreated state"
            echo "release object for $tag recreated (tag kept) — every leg's publish is a pure create"
          done

  windows:
    # repository_dispatch always fans to every platform (a source tarball
    # change reaches every scenario of the changed versions).
    needs: [prepare-release, plan]
    # Spec 36 §6: a catalog publish runs one caller per derived line shard
    # (fail-fast: false — one line's failure never blocks another line);
    # any other run is a single shard carrying the inputs verbatim.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[{"ruby_filter":"","release_tag":""}]') }}
    # always() + !cancelled(): a SKIPPED prepare-release (the ordinary
    # non-forced publish) must not skip the platform fan-out.
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      platform: windows
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  linux-gnu:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-gnu') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      platform: linux-gnu
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  linux-musl:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-musl') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      platform: linux-musl
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  macos:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      platform: macos
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  # The ONE release job per coordinator run. Spec 13 §2a's de-rendezvous
  # moved the publish into the legs (write-once per-leg names — no shared
  # release-asset mutation remains), and spec 36 §6 moved the AUDIT to the
  # tail of each (platform × shard) run — the matrix truth lives there,
  # never recomputed here. What serializes here is the
  # selected-platforms-green check and the registry renders + bot PRs, one
  # per shard tag (git arbitrates the PRs — the concurrency group is
  # politeness now, not correctness).
  release:
    name: Check the run + publish the registry
    needs: [plan, windows, linux-gnu, linux-musl, macos]
    runs-on: ubuntu-latest
    # The legs publish; this job only reads the release and pushes one
    # registry branch per shard. The 2026-08-09 hostage lesson still
    # bounds it — but there is no 2.5 GB download here anymore, so the
    # bound drops from the platform-publish 150 to 30.
    timeout-minutes: 30
    concurrency:
      group: publish-runtime-packages
      cancel-in-progress: false
    # Run when the run asked to publish (dispatch input or a source
    # repository_dispatch) and at least one platform actually built —
    # or unconditionally under registry_only, which builds nothing and
    # renders from the release as it stands.
    if: ${{ always() && !cancelled() && (((github.event_name == 'repository_dispatch' || inputs.publish || inputs.audit) && (needs.windows.result == 'success' || needs.linux-gnu.result == 'success' || needs.linux-musl.result == 'success' || needs.macos.result == 'success')) || inputs.registry_only) }}
    env:
      GITHUB_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registry bot PR pushes the publish branch — that needs the
          # PAT, not the runner's default (read-only) token.
          token: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          submodules: true

      - name: Setup Ruby gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The platform-green check: a platform SELECTED that did not build
      # green is named loudly (its own run's tail audit carries the
      # asset-level detail). The renders below still run (always()) — the
      # mirror carries what the release carries, never less (the
      # v0.16.27 lesson: a skipped render silently lags the release).
      - name: Check the selected platforms built green
        if: ${{ !inputs.registry_only }}
        run: |
          failed=""
          mark() { # $1=selected? $2=result $3=name
            if [ "$1" = "true" ] && [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              failed="$failed $3"
            fi
          }
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}"    "${{ needs.windows.result }}"    windows
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-gnu' }}"  "${{ needs.linux-gnu.result }}"  linux-gnu
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-musl' }}"  "${{ needs.linux-musl.result }}"  linux-musl
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}"      "${{ needs.macos.result }}"      macos
          if [ -n "$failed" ]; then
            echo "::error::these platforms were selected but did not build green — their packages did not land:$failed"
            exit 1
          fi

      # The registry mirror (spec 04 §2): rendered from each shard tag's
      # own per-package shards — the write-once per-leg metadata units,
      # ground truth — never from a job's local knowledge. One tebako
      # version per coordinator run (the VERSION file; registry_only
      # names it explicitly). A sharded catalog renders per line tag,
      # each render accumulating onto the previous one (REGISTRY_BASE_PATH)
      # so the per-tag bot PRs are supersets and merge in any order.
      - name: Render the registry entries (per shard tag)
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          REGISTRY_VERSION_INPUT: ${{ inputs.registry_version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${REGISTRY_VERSION_INPUT:-}"
          version="${version:-$(cat VERSION 2>/dev/null || true)}"
          if [ -z "$version" ]; then
            echo "::error::registry_only needs registry_version (e.g. 0.16.27) — none given and no VERSION file"
            exit 1
          fi
          shards="${SHARDS:-}"
          [ -n "$shards" ] || shards="[{\"release_tag\":\"${RELEASE_TAG_INPUT:-}\"}]"
          echo "$shards" | jq -r '.[].release_tag' | while read -r shard_tag; do
            ref="${shard_tag:-v${version}}"
            out="$RUNNER_TEMP/registry-${ref}.yaml"
            if [ -n "$shard_tag" ]; then export TEBAKO_RELEASE_TAG="$shard_tag"; else unset TEBAKO_RELEASE_TAG || true; fi
            # The accumulated base: the previous shard's render, so each
            # per-tag PR is a superset of the previous one.
            if [ -f "$RUNNER_TEMP/registry-accumulated.yaml" ]; then
              export REGISTRY_BASE_PATH="$RUNNER_TEMP/registry-accumulated.yaml"
            fi
            TEBAKO_VERSION="$version" REGISTRY_PATH="$out" ./tools/registry_update.rb
            cp "$out" "$RUNNER_TEMP/registry-accumulated.yaml"
            echo "rendered ${ref}"
          done

      # main is branch-protected: the registry lands by bot PR +
      # auto-merge, never by direct push. One PR per shard tag (the
      # branch names already shard by tag); each render is a superset of
      # the previous, so the PRs merge conflict-free in any order.
      # Idempotent across re-runs (an unchanged registry skips the branch).
      - name: Publish the registry via pull request (per shard tag)
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/registry-v*.yaml)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no rendered registry to publish (the render step did not run)"; exit 1; }
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          for file in "${files[@]}"; do
            ref="$(basename "$file" .yaml)"; ref="${ref#registry-}"
            branch="publish/${ref}-registry"
            echo "=== $ref → $branch"
            git checkout -b "$branch" origin/main 2>/dev/null || git checkout "$branch"
            cp "$file" tpkg-registry.yaml
            if git diff --quiet origin/main -- tpkg-registry.yaml; then
              echo "registry unchanged for $ref (or the entries already landed on main)"
              git checkout -- tpkg-registry.yaml
              continue
            fi
            git add tpkg-registry.yaml
            git commit -m "publish ${ref}: registry entries"
            # force-with-lease on the bot branch: a re-publish re-creates
            # it. The checkout is shallow, so the lease has no expectation
            # for a branch a DIED run left behind — fetch it first or the
            # push is rejected and the mirror never lands (the v0.16.27
            # hand-render hit exactly that). With the tracking ref in place
            # the lease still refuses a concurrent FOREIGN push, as
            # designed.
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
            git push --force-with-lease origin "$branch"
            if ! gh pr view "$branch" >/dev/null 2>&1; then
              body="$RUNNER_TEMP/registry-pr-body-${ref}.md"
              cat > "$body" <<EOF
          Automated registry entries for ${ref} — rendered from the
          release's per-package .manifest.json shards by tools/registry_update.rb
          (spec 13 §2a's audit+registry job; spec 04 §2's mirror). main is
          protected, so the registry lands by PR.
          EOF
              gh pr create --base main --head "$branch" \
                --title "publish ${ref}: registry entries" \
                --body-file "$body"
            fi
            gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
            # The next shard branches from a clean origin/main tree.
            git checkout -- tpkg-registry.yaml 2>/dev/null || true
          done

      - name: Ping the versions catalog
        if: ${{ always() && success() }}
        continue-on-error: true
        # Refreshes www.tebako.org/versions within minutes of a publish
        # (versions plan 05; the daily cron stays the backstop). The org
        # TEBAKO_CI_PAT_TOKEN must carry actions:write on
        # tamatebako/versions for the dispatch — until proven, a failed
        # ping never blocks a release.
        run: gh api repos/tamatebako/versions/dispatches -f event_type=runtime-published
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
