# The release coordinator — the explicit, operator-facing entry points:
#
#   workflow_dispatch: the three first-class slice shapes —
#       one ruby on every platform   (ruby_filter=<version>, platform=all)
#       one platform, every ruby     (ruby_filter=full|tidy|catalog, platform=<one>)
#       one ruby on one platform     (ruby_filter=<version>, platform=<one>)
#     plus the era baseline (ruby_filter=catalog, platform=all).
#   repository_dispatch "tebako release": a new tamatebako/ruby source pin
#     landed — compute_matrix.rb diffs the two pins' SHA256SUMS and only
#     the versions whose tarballs moved rebuild (a 4.0-only source release
#     rebuilds 4.0.x), on every platform, and publishes.
#
# Every leg fans out to _build-platform.yml to BUILD, and — spec 13 §2a's
# de-rendezvous — to PUBLISH and SIGN from each leg's own publish job
# (#190's split): the leg that built a package uploads its write-once
# names (the <stem>.tar.gz bundle + .sha256 sidecars + .manifest.json
# shard + the derived .blksum.json sidecar, spec 39 §3 + the co-published
# per-file members — bare exe, bare env image, windows DLL — spec 36 §3's
# co-publish mode, gem v0.4.0) and signs
# every served name, publishing the bytes the build job handed off as an
# immutable in-run artifact. No shared mutable file exists anymore (the
# monolithic manifest.json / SHA256SUMS.txt are gone — each shard IS its
# release-index entry, and the monoliths derive consumer-side), so N legs
# publish concurrently with zero rendezvous. The AUDIT lives at the tail
# of each _build-platform.yml run (spec 36 §6): the duty is per-platform
# by construction, and the platform run owns the matrix truth — never a
# recomputation, never a cross-run stale read. What remains here is the
# ONE release job per coordinator run: the selected-platforms-green check
# and the tpkg-registry.yaml mirror render + ONE accumulated bot PR per
# run (spec 04 §2; #275 retired the per-shard-tag PR fan-out — 20
# same-base branches editing one file conflicted the moment the first
# merged). And a force_rebuild republication passes through the
# prepare-release job first (#189): the release OBJECT is recreated under
# the kept tag, so every publish leg is a pure create on a free
# namespace — the per-asset delete→re-upload wedge never gets triggered.
#
# The acceptance jobs close a publish run (tebako#1125's coverage; the
# tebako-runtime-r#6 shape): per platform that published green, install
# the pair the freshly landed registry default names — through the
# contract-pinned tebako CLI, into a scratch TEBAKO_HOME — and run the
# native-open probe against the PUBLISHED bytes
# (spec/published_pair_spec.rb, tag :published_pair). The build-tree
# smoke cannot see the installed flow: what it boots is the freshly
# built pair off TEBAKO_RUNTIME_IMAGE; what a user runs is the registry
# default's bytes, fetched + mounted by the loader and dispatched by the
# shim — tebako#1125 (the published 0.17.15 macos pair whose boot-head
# insertion dyld stripped on macOS 14, the missing
# allow-dyld-environment-variables grant) shipped green in the former
# and died in the latter. The macos-arm64 acceptance leg pinned
# macos-14 as the entitlement class's exec canary: macOS 15's dyld
# tolerates the omission (the blind spot that shipped the class
# green), while macOS 14 strips DYLD_INSERT_LIBRARIES without the
# grant. That canary's home is gone — GitHub retired the macos-14
# runner image 2026-11-02 (jobs on the label cancel at queue), and
# macOS 15's dyld tolerance means macos-15 CANNOT canary the class:
# ci/macos-sign-notarize-runtime.sh's static embedded-profile
# assertion now carries it alone. The arm64 leg still gates the
# installed pair's boot on the current OS, so it rides macos-15.
#
# Spec 36 §6's topology: a CATALOG publish (ruby_filter=catalog, no
# release_tag override) derives its per-(line x platform) shard tags
# itself — v<VERSION>-ruby<line>-<platform> per ruby line in
# .github/matrix.json's catalog vocabulary x platform, no operator
# input (a release object caps at 1000 assets; a long line's full
# platform fan-out exceeds it, proven by the 0.16.32 catalog's wedged
# 4.0 line). The plan job emits the combined shard list plus one
# per-platform list per caller; the platform callers matrix over their
# own list; the release job renders the registry from every shard tag and
# lands ONE accumulated bot PR per run. The release_tag input remains as
# the override.
name: publish

on:
  workflow_dispatch:
    inputs:
      ruby_filter:
        description: 'Rubies: "full" (line tips), "tidy", "catalog" (every published version), or comma-separated versions'
        type: string
        default: 'full'
      platform:
        description: 'Platform slice: "all" or one of windows | linux-gnu | linux-musl | macos'
        type: string
        default: 'all'
      arch_filter:
        description: 'Optional arch slice within each platform (x86_64 | arm64)'
        type: string
        default: 'all'
      publish:
        description: 'Publish this run''s packages to the release'
        type: boolean
        default: true
      force_rebuild:
        description: 'Republication: recreate the release OBJECT under the kept tag, then publish fresh (#189 — the one exception to per-name byte-immutability, and never a per-asset delete)'
        type: boolean
        default: false
      audit:
        description: 'Audit only: verify the release against the expected matrix, no builds/uploads'
        type: boolean
        default: false
      registry_only:
        description: 'Registry only: render + publish the registry from the release as it stands (needs registry_version; no builds, no audit gate)'
        type: boolean
        default: false
      registry_version:
        description: 'The published tebako version to render for (e.g. 0.16.27) — required with registry_only'
        type: string
        default: ''
      release_tag:
        description: 'Host the release under this tag instead of v<VERSION> — a release object caps at 1000 assets, so a catalog publish shards per ruby line x platform (v0.17.1-ruby4.0-macos, …). Artifact names stay version-branded; only the tag moves. Empty = v<VERSION>.'
        type: string
        default: ''
      abi_bump:
        description: 'Deliberate ABI-vocabulary bump (spec 05 §5 continuity): non-empty acknowledges a darwin abi segment move vs the previous published line (e.g. "macos:darwin-24->darwin-23 — <reason>"). The continuity gate fails closed on any move without it; its text is recorded into the registry bot PR body.'
        type: string
        default: ''
  repository_dispatch:
    types: ['tebako release']

jobs:
  # Spec 36 §6's topology derivation: a catalog publish (ruby_filter=
  # catalog, no release_tag override) shards itself across per-line
  # release tags — v<VERSION>-ruby<line> per ruby line in the catalog
  # vocabulary, no operator input. Every other run is ONE shard carrying
  # the inputs verbatim, so the platform callers and the release job
  # consume the same plan either way.
  plan:
    name: Plan the publish topology
    runs-on: ubuntu-latest
    if: ${{ !inputs.registry_only }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shards_windows: ${{ steps.plan.outputs.shards_windows }}
      shards_linux_gnu: ${{ steps.plan.outputs.shards_linux_gnu }}
      shards_linux_musl: ${{ steps.plan.outputs.shards_linux_musl }}
      shards_macos: ${{ steps.plan.outputs.shards_macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          RUBY_FILTER: ${{ inputs.ruby_filter }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${RUBY_FILTER:-}" = "catalog" ] && [ -z "${RELEASE_TAG:-}" ]; then
            ruby -rjson -e '
              catalog = JSON.parse(File.read(".github/matrix.json")).fetch("ruby").fetch("catalog")
              version = File.read("VERSION").strip
              # A release object caps at 1000 assets; one ruby line can
              # exceed it (the 8-version 4.0 line wants ~1300 across ~20
              # per-package files x 8 triplets — the 0.16.32 catalog
              # wedged exactly there). Shard per (line x platform): every
              # shard keeps ~650 assets of headroom and no line can wedge
              # a sibling platform''s publish legs.
              platforms = %w[windows linux-gnu linux-musl macos]
              combined = []
              per_platform = platforms.to_h { |p| [p, []] }
              catalog.group_by { |v| v.split(".").first(2).join(".") }.each do |line, rubies|
                platforms.each do |platform|
                  shard = { "ruby_filter" => rubies.join(","),
                            "release_tag" => "v#{version}-ruby#{line}-#{platform}",
                            "platform" => platform }
                  combined << shard
                  per_platform[platform] << shard
                end
              end
              puts "catalog publish derives #{combined.size} line-by-platform shards: #{combined.map { |s| s["release_tag"] }.join(", ")}"
              File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
                f.puts "shards=#{JSON.generate(combined)}"
                per_platform.each do |platform, shards|
                  f.puts "shards_#{platform.tr("-", "_")}=#{JSON.generate(shards)}"
                end
              end
            '
          else
            single="[{\"ruby_filter\":\"${RUBY_FILTER:-}\",\"release_tag\":\"${RELEASE_TAG:-}\"}]"
            for out in shards shards_windows shards_linux_gnu shards_linux_musl shards_macos; do
              echo "$out=$single" >> "$GITHUB_OUTPUT"
            done
          fi

  # #189: a force_rebuild republication never deletes individual assets —
  # a deleted name 422-blocks re-uploads for hours server-side, and the
  # wedge's scope is the release OBJECT (proven by probe: a fresh object
  # under the same tag accepts the same names immediately). So a forced
  # republication recreates the release object under the kept tag BEFORE
  # any leg publishes; every publish leg on a fresh object is a pure
  # create (the gem's race-safe create arbitrates the legs' concurrent
  # re-creation). Non-forced runs skip this job entirely (payload assets
  # stay byte-immutable per name).
  prepare-release:
    name: Recreate the release object (force_rebuild)
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.registry_only && !inputs.audit && inputs.publish && inputs.force_rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the release object(s), keeping the tag(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          # Every shard tag's object is recreated (a sharded catalog's
          # republication recreates each line's object); the single-shard
          # case is exactly the old behavior. The default rides jq: a
          # JSON literal inside ${SHARDS:-...} is a brace trap — bash
          # closes the expansion at the JSON's first `}` and the
          # remainder rides the value (the 0.16.32 force_rebuild died
          # on jq's exit 5 with the delete already done).
          echo "${SHARDS:-null}" | jq -r '. // [{"release_tag":""}] | .[].release_tag' | while read -r shard_tag; do
            tag="${shard_tag:-v$(cat VERSION)}"
            # Idempotent: a missing object is already the recreated state
            # (a re-run after a mid-air death). --cleanup-tag=false (the
            # default, spelled out) keeps the tag on its commit. The
            # delete must be SEEN: a silently dropped delete (the
            # credential-class wedge — tebako-release#12) must not read
            # as "already recreated".
            if gh release view "$tag" --json id >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag=false
              sleep 5
              gh release view "$tag" --json id >/dev/null 2>&1 && {
                echo "::error::release object for $tag survived the delete — the credential cannot delete (tebako-release#12)"
                exit 1
              }
            else
              echo "no release object for $tag — already the recreated state"
            fi
            echo "release object for $tag recreated (tag kept) — every leg's publish is a pure create"
          done

  windows:
    # repository_dispatch always fans to every platform (a source tarball
    # change reaches every scenario of the changed versions).
    needs: [prepare-release, plan]
    # Spec 36 §6: a catalog publish runs one caller per derived
    # (line x platform) shard (fail-fast: false — one line's failure
    # never blocks another line); any other run is a single shard
    # carrying the inputs verbatim. Each platform caller matrices over
    # its own per-platform shard list.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_windows || '[{"ruby_filter":"","release_tag":""}]') }}
    # always() + !cancelled(): a SKIPPED prepare-release (the ordinary
    # non-forced publish) must not skip the platform fan-out.
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
      # attestations: the called workflow's publish job closes with the
      # SLSA L3 provenance arm — the grant flows from here, same as
      # id-token above.
      attestations: write
    with:
      platform: windows
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  linux-gnu:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_linux_gnu || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-gnu') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
      # attestations: the called workflow's publish job closes with the
      # SLSA L3 provenance arm — the grant flows from here, same as
      # id-token above.
      attestations: write
    with:
      platform: linux-gnu
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  linux-musl:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_linux_musl || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-musl') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
      # attestations: the called workflow's publish job closes with the
      # SLSA L3 provenance arm — the grant flows from here, same as
      # id-token above.
      attestations: write
    with:
      platform: linux-musl
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  macos:
    needs: [prepare-release, plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_macos || '[{"ruby_filter":"","release_tag":""}]') }}
    if: ${{ always() && !cancelled() && !inputs.registry_only && (github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos') }}
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/packages restate the called workflow's
    # existing needs (a permissions block is the complete set, not an
    # addition).
    permissions:
      contents: write
      packages: write
      id-token: write
      # attestations: the called workflow's publish job closes with the
      # SLSA L3 provenance arm — the grant flows from here, same as
      # id-token above.
      attestations: write
    with:
      platform: macos
      ruby_filter: ${{ matrix.shard.ruby_filter }}
      arch_filter: ${{ inputs.arch_filter || '' }}
      audit: ${{ inputs.audit || false }}
      publish: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
      release_tag: ${{ matrix.shard.release_tag }}
    secrets: inherit

  # The ONE release job per coordinator run. Spec 13 §2a's de-rendezvous
  # moved the publish into the legs (write-once per-leg names — no shared
  # release-asset mutation remains), and spec 36 §6 moved the AUDIT to the
  # tail of each (platform × shard) run — the matrix truth lives there,
  # never recomputed here. What serializes here is the
  # selected-platforms-green check and the registry render + ONE
  # accumulated bot PR per run (#275: the per-shard-tag fan-out wedged —
  # 20 same-base PRs editing one file conflicted once the first merged).
  release:
    name: Check the run + publish the registry
    needs: [plan, windows, linux-gnu, linux-musl, macos]
    runs-on: ubuntu-latest
    # The legs publish; this job only reads the release and pushes the
    # one registry branch. The 2026-08-09 hostage lesson still
    # bounds it — but there is no 2.5 GB download here anymore, so the
    # bound drops from the platform-publish 150 to 30.
    timeout-minutes: 30
    concurrency:
      group: publish-runtime-packages
      cancel-in-progress: false
    # Run when the run asked to publish (dispatch input or a source
    # repository_dispatch) and at least one platform actually built —
    # or unconditionally under registry_only, which builds nothing and
    # renders from the release as it stands.
    if: ${{ always() && !cancelled() && (((github.event_name == 'repository_dispatch' || inputs.publish || inputs.audit) && (needs.windows.result == 'success' || needs.linux-gnu.result == 'success' || needs.linux-musl.result == 'success' || needs.macos.result == 'success')) || inputs.registry_only) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The fleet identity (tebako-release#3): the registry bot PR's push
      # and the dispatches ride tebako-fleet App installation tokens —
      # App-pushed branches fire pull_request CI (a GITHUB_TOKEN never
      # does), and the token spends its own per-installation budget
      # instead of the shared per-user PAT. The registry-org token is
      # minted for the tebako-packages installation because the aggregate
      # nudge dispatches into tebako-packages/registry.
      - name: Mint the fleet token
        id: fleet
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
      - name: Mint the registry-org token
        id: fleet_registry
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
          owner: tebako-packages
      - name: Mint the product-repo token
        # The no-owner fleet token is scoped to THIS repository (the
        # action's default), so it 403s on tamatebako/tebako — the default
        # -runtime bump's target. Least privilege: the product token names
        # the product repo only.
        id: fleet_product
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
          owner: tamatebako
          repositories: tebako
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registry bot PR pushes the publish branch — the App token
          # is the identity that push rides.
          token: ${{ steps.fleet.outputs.token }}
          fetch-depth: 1
          submodules: true

      - name: Setup Ruby gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The platform-green check: a platform SELECTED that did not build
      # green is named loudly (its own run's tail audit carries the
      # asset-level detail). The renders below still run (always()) — the
      # mirror carries what the release carries, never less (the
      # v0.16.27 lesson: a skipped render silently lags the release).
      - name: Check the selected platforms built green
        if: ${{ !inputs.registry_only }}
        run: |
          failed=""
          mark() { # $1=selected? $2=result $3=name
            if [ "$1" = "true" ] && [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              failed="$failed $3"
            fi
          }
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}"    "${{ needs.windows.result }}"    windows
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-gnu' }}"  "${{ needs.linux-gnu.result }}"  linux-gnu
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-musl' }}"  "${{ needs.linux-musl.result }}"  linux-musl
          mark "${{ github.event_name == 'repository_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}"      "${{ needs.macos.result }}"      macos
          if [ -n "$failed" ]; then
            echo "::error::these platforms were selected but did not build green — their packages did not land:$failed"
            exit 1
          fi

      # The registry mirror (spec 04 §2): rendered from each shard tag's
      # own per-package shards — the write-once per-leg metadata units,
      # ground truth — never from a job's local knowledge. One tebako
      # version per coordinator run (the VERSION file; registry_only
      # names it explicitly). A sharded catalog renders per shard tag,
      # each render accumulating onto the previous one (REGISTRY_BASE_PATH)
      # so the final accumulated file is the release's complete mirror —
      # what the ONE bot PR below lands (#275).
      - name: Render the registry entries (per shard tag)
        id: render
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          REGISTRY_VERSION_INPUT: ${{ inputs.registry_version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
        run: |
          set -euo pipefail
          version="${REGISTRY_VERSION_INPUT:-}"
          version="${version:-$(cat VERSION 2>/dev/null || true)}"
          if [ -z "$version" ]; then
            echo "::error::registry_only needs registry_version (e.g. 0.16.27) — none given and no VERSION file"
            exit 1
          fi
          shards="${SHARDS:-}"
          if [ -z "$shards" ] && [ -z "${RELEASE_TAG_INPUT:-}" ]; then
            # registry_only against a sharded catalog: the plan job does
            # not run under registry_only, so the shard tags are
            # rediscovered from the release OBJECTS themselves — the bare
            # v<version> tag of an unsharded release, every
            # v<version>-ruby<line>-<platform> tag of a sharded one, in
            # the plan job's own emission order (line-major, then
            # windows/linux-gnu/linux-musl/macos) so a rediscovered
            # render is byte-identical with a plan-driven one. The
            # v0.16.30 registry_only (run 36363960486) died rendering a
            # bare v0.16.30 tag that never existed (#218).
            # The listing goes through GraphQL with only tagName+isDraft
            # selected: the REST releases endpoint embeds every release's
            # full asset array, and at catalog scale (~85 releases x
            # hundreds of assets = 36 MB) GitHub's backend 504s
            # intermittently server-side — two registry_only repairs for
            # v0.17.1 died on exactly that. The field selection keeps the
            # response at KBs regardless of asset count.
            releases_json="$RUNNER_TEMP/releases.json"
            if ! gh api graphql --paginate --slurp \
                 -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
                 -f query='query($owner: String!, $repo: String!, $endCursor: String) {
                   repository(owner: $owner, name: $repo) {
                     releases(first: 100, after: $endCursor, orderBy: {field: CREATED_AT, direction: DESC}) {
                       nodes { tagName isDraft }
                       pageInfo { hasNextPage endCursor }
                     }
                   }
                 }' > "$releases_json"; then
              echo "::error::could not list the releases to rediscover the shard tags for v${version} — a transient API failure; rerun the job"
              exit 1
            fi
            shards="$(jq --arg v "v${version}" -c '
              [ .[].data.repository.releases.nodes[] | select(.isDraft | not) | .tagName | select(. == $v or startswith($v + "-")) ] as $tags
              | ["windows", "linux-gnu", "linux-musl", "macos"] as $platforms
              | [ $tags[] | { tag: ., key: (((capture("-ruby(?<line>[0-9.]+)-(?<platform>windows|linux-gnu|linux-musl|macos)$")?) // null) as $m
                                | if $m then [($m.line | split(".") | map(tonumber)), ($platforms | index($m.platform))] else [[0], 9] end) } ]
              | sort_by(.key) | map({release_tag: .tag})' "$releases_json")"
            [ "$shards" != "[]" ] || {
              echo "::error::no release found for tag v${version} and no v${version}-* shard tag — nothing to mirror"
              exit 1
            }
            echo "rediscovered $(echo "$shards" | jq length) shard tag(s) for v${version}: $(echo "$shards" | jq -r 'map(.release_tag) | join(", ")')"
          fi
          [ -n "$shards" ] || shards="[{\"release_tag\":\"${RELEASE_TAG_INPUT:-}\"}]"
          echo "$shards" | jq -r '.[].release_tag' | while read -r shard_tag; do
            ref="${shard_tag:-v${version}}"
            out="$RUNNER_TEMP/registry-${ref}.yaml"
            if [ -n "$shard_tag" ]; then export TEBAKO_RELEASE_TAG="$shard_tag"; else unset TEBAKO_RELEASE_TAG || true; fi
            # The accumulated base: the previous shard's render, so the
            # loop's last iteration is the release's complete mirror.
            if [ -f "$RUNNER_TEMP/registry-accumulated.yaml" ]; then
              export REGISTRY_BASE_PATH="$RUNNER_TEMP/registry-accumulated.yaml"
            fi
            TEBAKO_VERSION="$version" REGISTRY_PATH="$out" ./tools/registry_update.rb
            cp "$out" "$RUNNER_TEMP/registry-accumulated.yaml"
            echo "rendered ${ref}"
          done

      # The product-side gate (trr#241): the accumulated render must parse
      # under the PRODUCT's own registry reader — the grammar's owner is
      # the product's resolve model, never a hand-copied schema here. The
      # pinned product release's CLI (contract.yml registry_reader_release —
      # a READER pin, deliberately separate from the legs' link unit) runs
      # `registry validate` over the accumulated file; a render the product
      # cannot read stops the line BEFORE any bot PR opens. The verb landed
      # after v2.8.27 — the gate needs a pin ≥ v2.8.28 and fails the run by
      # name on a pinned CLI that predates it (never a silent skip).
      - name: Validate the accumulated registry with the product reader
        if: ${{ always() && !cancelled() && !inputs.audit && steps.render.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          acc="$RUNNER_TEMP/registry-accumulated.yaml"
          [ -f "$acc" ] || { echo "::error::the render step left no accumulated registry (registry-accumulated.yaml missing)"; exit 1; }
          pin=$(grep -E '^registry_reader_release:' contract.yml | sed -E 's/^registry_reader_release: *"([^"]*)".*/\1/')
          [ -n "$pin" ] || { echo "::error::contract.yml pins no registry_reader_release — the registry gate needs the product release to validate against"; exit 1; }
          asset="tebako-${pin#v}-linux-gnu-x86_64"
          gh release download "$pin" --repo tamatebako/tebako --pattern "$asset" --dir "$RUNNER_TEMP/product-cli" --clobber
          chmod +x "$RUNNER_TEMP/product-cli/$asset"
          # The verb probe: a CLI carrying the verb answers its usage line;
          # a predating one answers "unknown command" (exit codes are
          # non-zero on both — the TEXT is the discriminator).
          probe_out="$("$RUNNER_TEMP/product-cli/$asset" registry validate 2>&1 || true)"
          if echo "$probe_out" | grep -q "unknown command"; then
            echo "::error::the pinned product CLI ($pin) predates the registry validate verb — bump contract.yml's link_unit_release to a release that carries it (≥ v2.8.28)"
            exit 1
          fi
          "$RUNNER_TEMP/product-cli/$asset" registry validate "$acc"
          echo "the accumulated registry parses under the product reader ($pin)"

      # The ABI continuity gate (the 0.17.14/0.17.15 darwin-24 drift
      # window's lesson — a patch line silently changed the ABI vocabulary
      # the resolver constrains native payloads by, and every
      # darwin-24-pressed payload found out at smoke time; spec 05 §5's
      # abi segment is resolution truth, so a move gets an era boundary's
      # treatment): the render's darwin rows are compared against the
      # previous line's rows on main. A move is legitimate ONLY as the
      # deliberate abi_bump dispatch input, and the acknowledged tuples +
      # the knob text are recorded into the registry bot PR body by the
      # publish step. The floor spelling itself is gated at build time
      # (Builder#assert_abi_floor!, docs/build-chain.md "The abi gates").
      - name: Gate the darwin abi continuity vs the previous line
        id: abi-gate
        if: ${{ always() && !cancelled() && !inputs.audit && steps.render.outcome == 'success' }}
        env:
          ABI_BUMP: ${{ inputs.abi_bump }}
        run: |
          set -euo pipefail
          acc="$RUNNER_TEMP/registry-accumulated.yaml"
          [ -f "$acc" ] || { echo "::error::the render step left no accumulated registry (registry-accumulated.yaml missing)"; exit 1; }
          git fetch --depth 1 origin main
          git show origin/main:tpkg-registry.yaml > "$RUNNER_TEMP/main-registry.yaml"
          ruby tools/registry_abi_gate.rb "$acc" "$RUNNER_TEMP/main-registry.yaml" "${ABI_BUMP:-}" \
            | tee "$RUNNER_TEMP/abi-gate.out"

      # main is branch-protected: the registry lands by bot PR +
      # auto-merge, never by direct push. ONE PR per coordinator run
      # carrying every shard tag's accumulated render (#275: the per-tag
      # fan-out put 20 same-base branches into the same file region — the
      # first merge conflicted the rest). Rerun-safe by construction: an
      # unchanged render is a no-op (against main AND against the bot
      # branch), an open PR on the branch is reused (the push IS the
      # update), a duplicate create is success, and an already-armed or
      # already-merged PR is the converged state, never an error.
      # Gated on the render step's success: a failed render must surface
      # its own named error, never the publish step's "nothing rendered"
      # (run 36363960486's masked failure, #218). Gated on the abi-gate
      # step's success too: an unacknowledged ABI-vocabulary move must
      # STOP the mirror here — a failed gate that still publishes is the
      # drift window shipped twice.
      - name: Publish the registry via pull request
        if: ${{ always() && !cancelled() && !inputs.audit && steps.render.outcome == 'success' && steps.abi-gate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
          REGISTRY_VERSION_INPUT: ${{ inputs.registry_version }}
          ABI_BUMP: ${{ inputs.abi_bump }}
        run: |
          set -euo pipefail
          acc="$RUNNER_TEMP/registry-accumulated.yaml"
          [ -f "$acc" ] || { echo "::error::the render step left no accumulated registry (registry-accumulated.yaml missing)"; exit 1; }
          version="${REGISTRY_VERSION_INPUT:-}"
          version="${version:-$(cat VERSION 2>/dev/null || true)}"
          [ -n "$version" ] || { echo "::error::cannot name the registry PR — no registry_version input and no VERSION file"; exit 1; }
          branch="publish/v${version}-registry"
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main

          git show origin/main:tpkg-registry.yaml > "$RUNNER_TEMP/main-registry.yaml"
          if cmp -s "$acc" "$RUNNER_TEMP/main-registry.yaml"; then
            echo "main's registry already mirrors the release — nothing to publish"
            exit 0
          fi

          # The bot branch carries the render. A re-run whose render is
          # byte-identical with the branch's is a true no-op — the
          # convergence property (#275): two successive publisher runs
          # with no release change push nothing.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/$branch" >/dev/null \
             && cmp -s "$acc" <(git show "origin/$branch:tpkg-registry.yaml"); then
            echo "$branch already carries exactly this render — no push"
          else
            git checkout -b "$branch" origin/main 2>/dev/null || git checkout "$branch"
            cp "$acc" tpkg-registry.yaml
            git add tpkg-registry.yaml
            git commit -m "publish v${version}: registry entries"
            # force-with-lease on the bot branch: a re-publish re-creates
            # it. The checkout is shallow, so the lease has no expectation
            # for a branch a DIED run left behind — the fetch above puts
            # the tracking ref in place; the lease still refuses a
            # concurrent FOREIGN push, as designed (the v0.16.27
            # hand-render hit exactly that).
            git push --force-with-lease origin "$branch"
          fi

          # PR reuse (#218, #275): an OPEN PR on the bot branch is the
          # delivery channel — the push above is the update, never a
          # fatal duplicate. gh pr view is the wrong probe here: it has
          # no state filter (a MERGED PR resolves) and a swallowed
          # transport error reads as "no PR", falling through to a create
          # that dies on "already exists" (the v0.17.1 publish's attempts
          # 2 and 3, run 37397000495). The probe is state-filtered, and a
          # probe failure is a named error — never a guess.
          probe() { gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty'; }
          if ! number="$(probe)"; then
            echo "::error::could not query the open PRs for $branch — refusing to guess (a wrong guess duplicates the PR or strands the render)"
            exit 1
          fi
          if [ -z "$number" ]; then
            body="$RUNNER_TEMP/registry-pr-body.md"
            cat > "$body" <<EOF
          Automated registry entries for v${version} — rendered from the
          release's per-package .manifest.json shards by tools/registry_update.rb
          (spec 13 §2a's audit+registry job; spec 04 §2's mirror). main is
          protected, so the registry lands by PR.
          EOF
            # The deliberate ABI-vocabulary bump (spec 05 §5 continuity):
            # the abi gate's acknowledged tuples + the dispatch knob text
            # ride the body, so the era-boundary treatment is visible at
            # the registry PR itself. Recorded only when the knob was
            # carried AND the gate acknowledged moves (a knob with no
            # moves is operator noise, not a bump).
            if [ -n "${ABI_BUMP:-}" ] && grep -q "^bump acknowledged:" "$RUNNER_TEMP/abi-gate.out" 2>/dev/null; then
              {
                printf '\n## ABI vocabulary bump (deliberate — the abi_bump dispatch input)\n\n'
                cat "$RUNNER_TEMP/abi-gate.out"
              } >> "$body"
            fi
            if ! create_out="$(gh pr create --base main --head "$branch" \
                                --title "publish v${version}: registry entries" \
                                --body-file "$body" 2>&1)"; then
              case "$create_out" in
                *"already exists"*)
                  # The probe→create race (a concurrent run opened the PR
                  # between the two): the push above already delivered the
                  # render to the branch the PR tracks.
                  echo "$create_out"
                  ;;
                *)
                  echo "$create_out" >&2
                  exit 1
                  ;;
              esac
            fi
            number="$(probe)" || true
            [ -n "${number:-}" ] || { echo "::error::$branch: the PR was created but could not be re-resolved"; exit 1; }
          fi

          # Idempotent merge arming: already-armed and already-merged are
          # converged states, never errors; only a fresh arm attempt can
          # fail, and then the immediate merge stays the fallback.
          meta="$(gh pr view "$number" --json state,autoMergeRequest \
                  --jq 'if .state == "OPEN" then (if .autoMergeRequest then "armed" else "open" end) else .state end')" || {
            echo "::error::could not read PR #${number}'s state"
            exit 1
          }
          case "$meta" in
            armed)
              echo "PR #${number}: auto-merge already armed"
              ;;
            MERGED)
              echo "PR #${number}: already merged"
              ;;
            open)
              gh pr merge --auto --squash "$number" || gh pr merge --squash "$number"
              ;;
            *)
              echo "::error::PR #${number} is in an unexpected state: ${meta}"
              exit 1
              ;;
          esac

      # tamatebako/tebako#1072: the product's default runtime line
      # (tebako-resolve's DEFAULT_TEBAKO_VERSION) follows the publish —
      # the factory proposes, the product owns (spec 00 §10: the crate
      # constant stays the single owner; this step only opens the PR).
      # Forward-only: a re-run of an older publish never drags the
      # default back; an equal-or-newer default is a no-op. The merge
      # rides the ordinary on-green rule — arming auto-merge is
      # attempted, an arm failure warns and leaves the PR open (the
      # product's protected main rejects an immediate merge while its
      # checks run; that is the design, not a failure of this step).
      - name: Propose the default-runtime bump to the product
        if: ${{ always() && !cancelled() && !inputs.audit && steps.render.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.fleet_product.outputs.token }}
          REGISTRY_VERSION_INPUT: ${{ inputs.registry_version }}
        run: |
          set -euo pipefail
          version="${REGISTRY_VERSION_INPUT:-}"
          version="${version:-$(cat VERSION 2>/dev/null || true)}"
          [ -n "$version" ] || { echo "::error::cannot name the default-runtime PR — no registry_version input and no VERSION file"; exit 1; }

          work="$RUNNER_TEMP/tebako-product"
          gh repo clone tamatebako/tebako "$work" -- --depth 1 --branch main
          cd "$work"
          # A fresh gh clone carries no push credentials (the registry
          # step's push rides actions/checkout's token config; there is no
          # checkout of the product here) — the remote carries the App
          # token explicitly. The token value is log-masked as a secret.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/tamatebako/tebako.git"
          file=crates/tebako-resolve/src/lib.rs
          current="$(sed -n 's/^pub const DEFAULT_TEBAKO_VERSION: &str = "\(.*\)";$/\1/p' "$file")"
          [ -n "$current" ] || { echo "::error::$file: DEFAULT_TEBAKO_VERSION not found in its expected shape"; exit 1; }
          echo "product default: $current — just published: $version"

          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)"
          if [ "$current" = "$version" ] || [ "$newest" != "$version" ]; then
            echo "default already at $current (>= the published $version) — nothing to propose"
            exit 0
          fi

          branch="publish/v${version}-default-runtime"
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git checkout -b "$branch" 2>/dev/null || git checkout "$branch"
          sed -i "s/^pub const DEFAULT_TEBAKO_VERSION: &str = \".*\";$/pub const DEFAULT_TEBAKO_VERSION: \&str = \"${version}\";/" "$file"
          git add "$file"
          if git diff --cached --quiet; then
            echo "$branch already carries exactly this bump — no push"
          else
            git commit -m "resolve: DEFAULT_TEBAKO_VERSION → ${version} (tamatebako/tebako#1072)"
            git push --force-with-lease origin "$branch"
          fi

          probe() { gh pr list --repo tamatebako/tebako --head "$branch" --state open --json number --jq '.[0].number // empty'; }
          if ! number="$(probe)"; then
            echo "::error::could not query the product's open PRs for $branch — refusing to guess"
            exit 1
          fi
          if [ -z "$number" ]; then
            body="$RUNNER_TEMP/default-runtime-pr-body.md"
            cat > "$body" <<EOF
          The runtime factory published [v${version}](https://github.com/tamatebako/tebako-runtime-ruby/releases/tag/v${version});
          the product's default runtime line follows it (tamatebako/tebako#1072).

          The constant's single owner stays \`crates/tebako-resolve\`; this
          PR is the factory's proposal, opened by publish.yml — no publish
          can move the default silently, and no unrelated PR carries the
          bump as a drive-by again.

          Merged by the ordinary on-green rule: the product's CI runs the
          acceptance surface against this line.
          EOF
            if ! create_out="$(gh pr create --repo tamatebako/tebako --base main --head "$branch" \
                                --title "resolve: DEFAULT_TEBAKO_VERSION → ${version}" \
                                --body-file "$body" 2>&1)"; then
              case "$create_out" in
                *"already exists"*)
                  # The probe→create race: the push above already
                  # delivered the bump to the branch the PR tracks.
                  echo "$create_out"
                  ;;
                *)
                  echo "$create_out" >&2
                  exit 1
                  ;;
              esac
            fi
            number="$(probe)" || true
            [ -n "${number:-}" ] || { echo "::error::$branch: the product PR was created but could not be re-resolved"; exit 1; }
          fi

          meta="$(gh pr view "$number" --repo tamatebako/tebako --json state,autoMergeRequest \
              --jq 'if .state == "OPEN" then (if .autoMergeRequest then "armed" else "open" end) else .state end')" || {
            echo "::error::could not read the product PR #${number}'s state"
            exit 1
          }
          case "$meta" in
            armed|MERGED)
              echo "product PR #${number}: ${meta} — converged"
              ;;
            open)
              if ! gh pr merge --repo tamatebako/tebako --auto --squash "$number"; then
                echo "::warning::auto-merge arm failed for tamatebako/tebako#${number} — the PR stays open for the ordinary on-green merge"
              fi
              ;;
            *)
              echo "::error::product PR #${number} is in an unexpected state: ${meta}"
              exit 1
              ;;
          esac

      # Immediacy, not correctness (tebako-packages/registry#5). The
      # official aggregate polls every six hours, so a publish stays
      # invisible to `tebako install` until the next tick. Fired only AFTER
      # the registry PR is merged (the aggregate reads this feedstock's
      # registry at its default branch); an undeliverable dispatch warns and
      # leaves the cron as the floor.
      - name: Nudge the official registry's aggregate
        env:
          GH_TOKEN: ${{ steps.fleet_registry.outputs.token }}
        run: |
          set -uo pipefail
          version="$(cat VERSION)"
          branch="publish/v${version}-registry"
          merged=""
          for _ in $(seq 1 30); do
            merged=$(gh pr list --head "$branch" --state merged --json number --jq '.[0].number // empty' 2>/dev/null || true)
            [ -n "$merged" ] && break
            sleep 10
          done
          if [ -z "$merged" ]; then
            echo "::warning::the registry row is not on main yet — the six-hourly tick catches it"
            exit 0
          fi
          gh api repos/tebako-packages/registry/dispatches \
            -f event_type=feedstock-published \
            -f client_payload[feedstock]="${{ github.repository }}" \
            -f client_payload[tag]="${{ github.ref_name }}" \
            || echo "::warning::the aggregate dispatch failed — the six-hourly tick still catches it"

      - name: Ping the versions catalog
        if: ${{ always() && success() }}
        continue-on-error: true
        # Refreshes www.tebako.org/versions within minutes of a publish
        # (versions plan 05; the daily cron stays the backstop). The
        # tebako-fleet App carries actions:write on tamatebako/versions
        # (installed on every tamatebako repo) — a failed ping never
        # blocks a release regardless.
        run: gh api repos/tamatebako/versions/dispatches -f event_type=runtime-published
        env:
          GH_TOKEN: ${{ steps.fleet.outputs.token }}

  # The published-pair acceptance (tebako#1125's coverage — the header
  # note; the tebako-runtime-r#6 shape). One job per platform, gated on
  # THAT platform's green publish: a platform that was not selected or
  # did not build green has nothing to accept, and a red sibling never
  # masks a green platform's verdict. Each installs the registry
  # default's pair through the contract-pinned tebako CLI into a scratch
  # TEBAKO_HOME and runs spec/published_pair_spec.rb (tag
  # :published_pair) against the PUBLISHED bytes — the shim dispatch
  # proof plus the tebako#1125 native-open probe.
  acceptance-linux-gnu:
    name: Acceptance — the installed pair (linux-gnu)
    needs: [release, linux-gnu]
    if: ${{ always() && !cancelled() && !inputs.registry_only && !inputs.audit && (github.event_name == 'repository_dispatch' || inputs.publish) && needs.linux-gnu.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, host: ubuntu-24.04 }
          - { arch: arm64,  host: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The acceptance installs what the registry default names — only
      # truthful once the publish's registry row is on main (main is
      # protected; the row lands by bot PR + auto-merge). A timeout is a
      # NAMED failure: installing anyway would test the PREVIOUS
      # release's bytes and report their verdict as this publish's.
      - name: Wait for the registry row on main
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version="$(cat VERSION)"
          branch="publish/v${version}-registry"
          landed=""
          for _ in $(seq 1 60); do
            merged=$(gh pr list --head "$branch" --state merged --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$merged" ]; then
              landed="registry PR #${merged} merged"
              break
            fi
            # Idempotent republication: an unchanged render opens no PR
            # — the rows are already on main. Ruby's rows spell
            # "<ruby>-<tebako>" (3.1.6-0.16.23), so the match is the
            # tebako-version SUFFIX, YAML-parsed, never a grep guess.
            if gh api "repos/${{ github.repository }}/contents/tpkg-registry.yaml?ref=main" --jq .content 2>/dev/null \
                 | base64 -d > "$RUNNER_TEMP/registry-main.yaml" \
               && ruby -ryaml -e '
                    rows = YAML.load_file(ARGV[1]).fetch("payloads").flat_map { |p| p.fetch("versions", []) }
                    exit(rows.any? { |r| r["version"].to_s.end_with?("-#{ARGV[0]}") } ? 0 : 1)' "$version" "$RUNNER_TEMP/registry-main.yaml"; then
              landed="the registry on main already names -${version} (no merged PR — an unchanged render)"
              break
            fi
            sleep 10
          done
          if [ -z "$landed" ]; then
            echo "::error::${branch} is not merged and main's registry names no -${version} row within 10 minutes — installing now would test the PREVIOUS release's bytes"
            exit 1
          fi
          echo "$landed"

      # The contract-pinned tebako product line's CLI drives the install
      # — the same link_unit_release pin the legs' link unit + tfs CLI
      # ride (one product release, one line, proven together).
      # tebako-shim rides beside it: `install` links shims/<name> onto a
      # tebako-shim, and the pair's layout mirrors an installed prefix.
      # The tfs CLI packs the native-open probe's fixture image.
      - name: Fetch + verify the pinned tebako CLI trio
        env:
          PID: linux-gnu-${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) shac="shasum -a 256" ;;
            *)      shac="sha256sum" ;;
          esac
          pin=$(ruby -ryaml -e 'puts YAML.load_file("contract.yml")["link_unit_release"]')
          ver="${pin#v}"
          base="https://github.com/tamatebako/tebako/releases/download/${pin}"
          mkdir -p .build/acceptance-cli
          for tool in tebako tebako-shim tfs; do
            asset="${tool}-${ver}-${PID}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}" "${base}/${asset}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}.sha256" "${base}/${asset}.sha256"
          done
          ( cd .build/acceptance-cli
            $shac -c "tebako-${ver}-${PID}.sha256"
            $shac -c "tebako-shim-${ver}-${PID}.sha256"
            $shac -c "tfs-${ver}-${PID}.sha256"
            mv "tebako-${ver}-${PID}" tebako
            mv "tebako-shim-${ver}-${PID}" tebako-shim
            mv "tfs-${ver}-${PID}" tfs
            chmod +x tebako tebako-shim tfs )
          echo "tebako CLI trio ${pin} (${PID}) fetched + sha256-verified"

      # The gnu exes run on the ubuntu host kernel directly (the build
      # legs' own smoke convention). The fixture compiles against the
      # harness ruby's headers (the probe ext's API surface is stable
      # across every line the factory ships — its comment says so).
      - name: Install the published pair + run the native-open probe
        env:
          TEBAKO_PUBLISHED_PAIR: "1"
        run: |
          set -euo pipefail
          export TEBAKO_PUBLISHED_PAIR_CLI="$PWD/.build/acceptance-cli/tebako"
          export TEBAKO_SMOKE_TFS="$PWD/.build/acceptance-cli/tfs"
          export TEBAKO_SMOKE_RUBY_HEADERS="$(ruby -e 'print RbConfig::CONFIG["rubyhdrdir"]')"
          bundle exec rspec --tag published_pair --format documentation

  acceptance-linux-musl:
    name: Acceptance — the installed pair (linux-musl)
    needs: [release, linux-musl]
    if: ${{ always() && !cancelled() && !inputs.registry_only && !inputs.audit && (github.event_name == 'repository_dispatch' || inputs.publish) && needs.linux-musl.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, host: ubuntu-24.04 }
          - { arch: arm64,  host: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Same wait as the gnu job: the registry row must be on main
      # before the install, or the acceptance tests the PREVIOUS
      # release's bytes.
      - name: Wait for the registry row on main
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version="$(cat VERSION)"
          branch="publish/v${version}-registry"
          landed=""
          for _ in $(seq 1 60); do
            merged=$(gh pr list --head "$branch" --state merged --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$merged" ]; then
              landed="registry PR #${merged} merged"
              break
            fi
            if gh api "repos/${{ github.repository }}/contents/tpkg-registry.yaml?ref=main" --jq .content 2>/dev/null \
                 | base64 -d > "$RUNNER_TEMP/registry-main.yaml" \
               && ruby -ryaml -e '
                    rows = YAML.load_file(ARGV[1]).fetch("payloads").flat_map { |p| p.fetch("versions", []) }
                    exit(rows.any? { |r| r["version"].to_s.end_with?("-#{ARGV[0]}") } ? 0 : 1)' "$version" "$RUNNER_TEMP/registry-main.yaml"; then
              landed="the registry on main already names -${version} (no merged PR — an unchanged render)"
              break
            fi
            sleep 10
          done
          if [ -z "$landed" ]; then
            echo "::error::${branch} is not merged and main's registry names no -${version} row within 10 minutes — installing now would test the PREVIOUS release's bytes"
            exit 1
          fi
          echo "$landed"

      - name: Fetch + verify the pinned tebako CLI trio
        env:
          PID: linux-musl-${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) shac="shasum -a 256" ;;
            *)      shac="sha256sum" ;;
          esac
          pin=$(ruby -ryaml -e 'puts YAML.load_file("contract.yml")["link_unit_release"]')
          ver="${pin#v}"
          base="https://github.com/tamatebako/tebako/releases/download/${pin}"
          mkdir -p .build/acceptance-cli
          for tool in tebako tebako-shim tfs; do
            asset="${tool}-${ver}-${PID}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}" "${base}/${asset}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}.sha256" "${base}/${asset}.sha256"
          done
          ( cd .build/acceptance-cli
            $shac -c "tebako-${ver}-${PID}.sha256"
            $shac -c "tebako-shim-${ver}-${PID}.sha256"
            $shac -c "tfs-${ver}-${PID}.sha256"
            mv "tebako-${ver}-${PID}" tebako
            mv "tebako-shim-${ver}-${PID}" tebako-shim
            mv "tfs-${ver}-${PID}" tfs
            chmod +x tebako tebako-shim tfs )
          echo "tebako CLI trio ${pin} (${PID}) fetched + sha256-verified"

      # The musl runtime is dynamic-musl BY DESIGN (the build legs' own
      # convention): exec it in a real musl userland of the same
      # generation — alpine, exactly like the musl boot-smoke step.
      - name: Install the published pair + run the native-open probe (in alpine)
        run: |
          set -euo pipefail
          docker run --rm -v ${{ github.workspace }}:/mnt/w -w /mnt/w \
            -e TEBAKO_PUBLISHED_PAIR=1 \
            -e TEBAKO_PUBLISHED_PAIR_CLI=/mnt/w/.build/acceptance-cli/tebako \
            -e TEBAKO_SMOKE_TFS=/mnt/w/.build/acceptance-cli/tfs \
            alpine:3.21 sh -c '
              set -e
              apk add --no-cache ruby ruby-dev build-base ruby-bundler git \
                curl bash ca-certificates >/dev/null
              export TEBAKO_SMOKE_RUBY_HEADERS="$(ruby -e "print RbConfig::CONFIG[%q{rubyhdrdir}]")"
              bundle install --jobs 4 --retry 3
              bundle exec rspec --tag published_pair --format documentation'

  acceptance-macos:
    name: Acceptance — the installed pair (macos)
    needs: [release, macos]
    if: ${{ always() && !cancelled() && !inputs.registry_only && !inputs.audit && (github.event_name == 'repository_dispatch' || inputs.publish) && needs.macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOT a canary (the header note): the macos-14 exec canary's
          # home is gone — GitHub retired the image 2026-11-02 — and
          # macOS 15's dyld tolerates a missing
          # allow-dyld-environment-variables grant (the blind spot that
          # shipped tebako#1125's class green on the published 0.17.15
          # pair), so no current runner strips DYLD_INSERT_LIBRARIES
          # without it. The entitlement class rides
          # ci/macos-sign-notarize-runtime.sh's static embedded-profile
          # assertion alone; this leg gates the installed pair's boot
          # on the current OS.
          - { arch: arm64,  host: macos-15 }
          # The only Intel runner at or above the exe's 14.0 floor
          # (contract.yml's macos_deployment_target); the entitlement
          # class rides the sign script's static assertion alone,
          # arch-independent (the arm64 exec canary's home retired
          # with macos-14).
