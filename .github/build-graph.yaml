# The build dependency tree for tebako-runtime-ruby — the single model
# every workflow's matrix is COMPUTED from (scripts/compute_matrix.rb).
#
# The law: a leg runs because something it READS changed — never because
# "the workflow fired". A change's blast radius is the set of legs whose
# declared inputs intersect the diff (transitively). No platform re-runs
# for another platform's change; no ruby version re-runs for another
# version's change; no leg re-runs for docs.
#
# The prepare job of each per-platform workflow evaluates this file.
version: 1

# Shared inputs — TRUE dependencies of every runtime leg on every
# platform. A change here affects the whole matrix by construction.
shared:
  - build/lib/**            # the builder model (Platform, SourceFetcher, MountRoot, …)
  - build/tools/**          # build_pass.rb and friends
  - build/resources/**      # the stub/driver resources compiled into every runtime
  - build/CMakeLists.txt
  - build/cmake/**
  - tools/build_runtime
  - scripts/compute_matrix.rb           # the matrix planner (the compute stage itself)
  - scripts/check_contract_version.rb   # the compute-stage preflight gate
  - Gemfile
  - Gemfile.lock
  - VERSION                 # the tebako version (artifact names)
  - contract.yml            # the contract version (release cards)
  - .github/matrix.json     # the version/env vocabularies
  - .github/build-graph.yaml # this model
  - .github/workflows/_build-platform.yml # the one per-platform build/publish unit

# Per-platform inputs — a change here affects ONLY that platform's legs.
platforms:
  windows:
    - ci/link-unit.sh
    - ci/check_symbol_provenance.sh
    - .github/workflows/build-windows.yml
  linux-gnu:
    - ci/link-unit-posix.sh
    - ci/check_symbol_provenance.sh
    - .github/workflows/build-linux-gnu.yml
  linux-musl:
    - ci/link-unit-posix.sh
    - ci/check_symbol_provenance.sh
    - .github/workflows/build-linux-musl.yml
  macos:
    - ci/link-unit-posix.sh
    - ci/check_symbol_provenance.sh
    - Brewfile
    - .github/workflows/build-macos.yml

# Validation-only changes (specs, lint config): run the tidy validation
# legs, never a publish-shaped build.
validation_only:
  - spec/**
  - .rubocop*.yml

# Publish/release tooling — consumed AT RELEASE time against already-built
# artifacts (the coordinator's release job, the pin-bump bot, the
# bare-launch probe), never read by any build leg. A diff touching only
# these cannot change build outputs: NO legs at all, on any platform —
# the publish-hardening class (a scripts/upload_release.rb-only PR once
# spent the tidy matrix on every platform for zero build signal).
publish_only:
  - scripts/upload_release.rb              # the release job's manifest merge/upload
  - .github/workflows/publish.yml          # the release coordinator (dispatch-only)
  - .github/workflows/bump-source-pin.yml  # the pin-bump bot — its OUTPUT (a pin PR) triggers the builds
  - .github/workflows/probe-bare-launch.yml # the bare-machine launch probe (dispatch-only)

# Never build inputs.
ignore:
  - docs/**
  - "**.md"
  - "**.adoc"
  - .github/ISSUE_TEMPLATE/**
