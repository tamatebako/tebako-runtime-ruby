# Bootstrap <-> runtime contract version (roadmap 45): the versioned
# protocol between the tebako bootstrap (released from tamatebako/tebako)
# and the runtime images published from this repo -- the env vars passed
# down, the argv layout, and the filesystem-image handoff.
#
# Bump rules: any change to env/argv/handoff semantics bumps the integer
# by exactly +1, here and in the compiled-in TEBAKO_CONTRACT_VERSION
# (contract 2: crates/tebako-driver in the tebako product repo, consumed
# as libtebako_driver.a; contract 1 was build/src/tebako-main.cpp). The
# two are CI-locked in agreement by scripts/check_contract_version.rb
# (TEBAKO_DRIVER_SRC points the check at the consumed driver's source).
# The release pipeline reads this file (scripts/upload_release.rb emits
# it into every manifest.json entry) and the driver exports it as the
# TEBAKO_CONTRACT_VERSION env var.
#
# Schema: schema/contract.schema.yml (validated by the same check).
#
# container_version: the toolchain CONTAINER line the builds run inside
# (ghcr.io/tamatebako/tebako-<platform>:<container_version>-<arch>) —
# an axis INDEPENDENT of the artifact version (VERSION file). The build
# legs reference it via needs.compute.outputs.container-version, and the
# preflight-containers job fails the run in seconds when a tag is
# missing (2026-08-05: VERSION 0.16.3 briefly referenced a nonexistent
# 0.16.3 container — manifest unknown, ~40 min into every leg). Pinned
# at the last-published v1 containers until the tpkg-builder images
# (tebako-ci-containers) take over with their own tag scheme.
---
contract_version: 2
container_version: "0.16.2"
# The published link-unit pin: the tamatebako/tebako release whose
# prebuilt link unit (driver + scoped tfs + the native closure, per
# triplet) the legs CONSUME as a download instead of building from
# source. The closure depends on the triplet and the product release
# only — never on the ruby version — so a pin hit turns staging into a
# ~30 s download. Empty = build from source (the driver is moving: the
# pin must name a release whose driver carries everything the factory
# asserts — the boot smoke's contract-version check proves the match
# per leg). A platform with no published unit (gnu, until the product
# ships a floor build) misses the pin and builds from source — a miss
# is never an error.
link_unit_release: "v0.1.9"
