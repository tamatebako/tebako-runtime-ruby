# Bootstrap <-> runtime contract version (roadmap 45): the versioned
# protocol between the tebako bootstrap (released from tamatebako/tebako)
# and the runtime images published from this repo -- the env vars passed
# down, the argv layout, and the filesystem-image handoff.
#
# Bump rules: any change to env/argv/handoff semantics bumps the integer
# by exactly +1, here and in the compiled-in TEBAKO_CONTRACT_VERSION
# (contract 2: crates/tebako-driver in the tebako product repo, consumed
# as libtebako_driver.a; contract 1 was build/src/tebako-main.cpp). The
# two are CI-locked in agreement by scripts/check_contract_version.rb
# (TEBAKO_DRIVER_SRC points the check at the consumed driver's source).
# The release pipeline reads this file (scripts/upload_release.rb emits
# it into every manifest.json entry) and the driver exports it as the
# TEBAKO_CONTRACT_VERSION env var.
#
# Schema: schema/contract.schema.yml (validated by the same check).
#
# container_version: the toolchain CONTAINER line the builds run inside
# (ghcr.io/tamatebako/tebako-<platform>:<container_version>-<arch>) —
# an axis INDEPENDENT of the artifact version (VERSION file). The build
# legs reference it via needs.compute.outputs.container-version, and the
# preflight-containers job fails the run in seconds when a tag is
# missing (2026-08-05: VERSION 0.16.3 briefly referenced a nonexistent
# 0.16.3 container — manifest unknown, ~40 min into every leg). Pinned
# at the last-published v1 containers until the tpkg-builder images
# (tebako-ci-containers) take over with their own tag scheme.
---
contract_version: 2
container_version: "0.16.2"
# The published link-unit pin: the tamatebako/tebako release whose
# prebuilt link unit (driver + scoped tfs + the native closure, per
# triplet) the legs CONSUME as a download instead of building from
# source. The closure depends on the triplet and the product release
# only — never on the ruby version — so a pin hit turns staging into a
# ~30 s download. Empty = build from source (the driver is moving: the
# pin must name a release whose driver carries everything the factory
# asserts — the boot smoke's contract-version check proves the match
# per leg). A platform with no published unit misses the pin and
# builds from source — a miss is never an error. v0.2.0 was the first
# product release with a floor-built gnu unit (ubuntu:20.04, binutils
# 2.34 — tebako#413's arscope GNU_UNIQUE demotion, tebako#431), so the
# gnu leg now hits the pin too; v0.2.1 carries the libtfs-preload
# fork/exec deadlock fix (tebako#433) on the same floor build;
# v0.2.2 adds the driver-owned SSL_CERT_FILE export (tebako#441) and the
# LFS64/fortify alias-surface jail coverage (tebako#443); v0.2.3 strips
# DYLD_INSERT_LIBRARIES for exec targets the arm64 dylib cannot load —
# the arm64e child kill on macOS native-ext presses (tebako#448/#449);
# v0.2.4 completes #448: the driver scrubs its micro interpose dylib and
# the sentinel from the child-facing env (tebako#451); v0.2.6 carries
# the TEBAKO_TFS_MOUNTS slot form (tebako#455/#462) and the limnifs
# 0.2.62 floor (tebako#463) on the resolve-corrected asset spelling
# (tebako#456/#461); v0.3.0 flips the limnifs image format (the
# replaced-v1 layout — reader floor limnifs-core 0.3.0, spec 20 §5) with
# the 0.3.3 windowed-read path, and moves the vendored crypto link onto
# rnp-sys (rnp-rs 0.1.12; tebako#479/#480) — the unit's tfs reads ONLY
# new-format images, so every env image must be re-baked by this re-cut.
# v0.3.2 adds the windows host tier (spec 22 §3.2, tebako#485): a
# co-mounted dependency's declared executables materialize to host files
# at spawn (java_home mounts extract whole-tree), so a windows runtime
# can spawn a dependency's exe (openjdk's java.exe) off the VFS — the
# metanorma → mn2pdf → java chain.
# v0.3.3 (tebako#488): union mount members serialize into
# TEBAKO_TFS_MOUNTS (a spawned child re-mounts the FULL tree — the
# packed-mn POSIX jarfile ENOENT) and a data file materialized for exec
# brings its in-image directory's files (jing's RelaxNG same-dir
# includes — spec 22 Rule E4); both ride the link unit, no source
# change, so the source pin stays v0.2.30.
# v0.3.4: the unix host-launcher tier routes its exec materialization
# through the same home-tree decision the spawn surface and the windows
# tier already used (spec 22 §3.2) — a bare-name `java` spawn now execs
# the whole-tree home copy whose java.home carries conf/, fixing the
# JCE NoSuchFileException that killed every POSIX mn2pdf render in
# packed-mn. No source change; the pin stays v0.2.30.
# v2.0.0 (tebako#492): the preload shim's constructor mount pass does no
# IO under the context guard — the union arm's second build_decl under
# the lock self-deadlocked on ELF (the packed-mn linux-gnu acceptance
# hang). The v2 era tag line begins here (the v0.x namespace is squatted
# by v1 ghost tags). No source change; the pin stays v0.2.30.
# v2.1.0 (spec 30): the driver's spawned-runtime planner + the
# tebako_spawn_runtime_plan FFI (tebako#508) — the ruby side rides the
# v0.2.32 source pin (ruby#106's FFI head calls it; weak extern, so even
# a mismatched pair degrades to pass-through, never breaks).
# v2.1.3 (tebako#515): the preload shim interposes the realpath family
# (realpath / canonicalize_file_name / __realpath_chk / macOS's
# realpath$DARWIN_EXTSN) and gates the vfork-child pid surface. A
# spawned child's realpath(3) — the JDK's File.getCanonicalFile
# canonicalizes every -jar/-cp entry — used to ride libc-INTERNAL
# aliases past the preload: on usrmerge hosts a root-mounted payload's
# /lib/… answer came back /usr/lib/…, a spelling the VFS cannot serve,
# which dropped the payload's jing jar from the classpath (the dogfood
# linux-gnu ClassNotFound; PROGRESS/31). Contract unchanged (2 — the
# interpose is behavioral, no env/argv change). Every published runtime
# exe embeds the driver closure, so this re-cut runs the full catalog.
# v2.1.4 (tebako#516): the realpath NULL-buffer arm's host pass-through
# no longer rides plain dlsym(RTLD_NEXT, "realpath") — on glibc ≤ 2.31
# (the ubuntu:20.04 build floor, and any equally old host) that lookup
# lands on the versioned compat twin realpath@GLIBC_2.0, which EINVALs
# resolved == NULL, so every HostPolicy::bind canonicalize failed and
# TEBAKO_JAIL refused to install (exit 78) — the 0.16.19 linux-gnu
# catalog legs all died at the boot smoke's jailed java spawn. The NULL
# arm now routes to canonicalize_file_name (a single-version GNU symbol
# with malloc'd-result semantics — exactly the NULL arm's contract) on
# linux. Contract unchanged (2). Full-catalog re-cut again: the runtime
# exe embeds the closure.
link_unit_release: "v2.1.4"
